<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeeec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>단어 스릴러 · 급수 선택</title>
<style>
/* ---------------------------------------------------------------
   Palette. Two themes, one language: near-flat page, list rows that
   are a shade lighter (dark) / a shade darker (light) than the page,
   almost no hairlines, and exactly one chromatic accent (amber) that
   appears on the app mark, the "today" dot and word tokens.
   Every color below is a variable — nothing outside :root/[data-theme]
   is allowed to hardcode a hex, or the theme toggle silently breaks.
   --------------------------------------------------------------- */
:root {
  color-scheme: light dark;
  --bg:#efeeec;
  --paper:#ffffff;
  --surface:#f5f5f3;
  --surface-hover:#ececea;
  --surface-strong:#e7e7e3;
  --seg-active:#ffffff;
  --ink:#37352f;
  --muted:#5d5b56;
  --faint:#767471;
  --line:#eae9e5;
  --accent:#8a5a12;
  --accent-soft:#f6ecd8;
  --word-bg:#f6ecd6;
  --word-hover:#eddfbc;
  --word-ink:#5f4310;
  --scrim:rgba(30,29,26,.32);
  --shadow:0 16px 44px rgba(25,24,20,.16);
  --app-shadow:0 0 40px rgba(0,0,0,.05);
  --header-bg:rgba(255,255,255,.9);
  --seg-shadow:0 1px 3px rgba(25,24,20,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#141414;
    --paper:#191919;
    --surface:#202020;
    --surface-hover:#252525;
    --surface-strong:#2b2b2b;
    --seg-active:#333333;
    --ink:#e9e9e7;
    --muted:#a3a29d;
    --faint:#85857f;
    --line:#272727;
    --accent:#d9a44f;
    --accent-soft:#2a2318;
    --word-bg:#2a2419;
    --word-hover:#383021;
    --word-ink:#efc887;
    --scrim:rgba(0,0,0,.58);
    --shadow:0 16px 44px rgba(0,0,0,.6);
    --app-shadow:0 0 40px rgba(0,0,0,.35);
    --header-bg:rgba(25,25,25,.88);
    --seg-shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg:#141414;
  --paper:#191919;
  --surface:#202020;
  --surface-hover:#252525;
  --surface-strong:#2b2b2b;
  --seg-active:#333333;
  --ink:#e9e9e7;
  --muted:#a3a29d;
  --faint:#85857f;
  --line:#272727;
  --accent:#d9a44f;
  --accent-soft:#2a2318;
  --word-bg:#2a2419;
  --word-hover:#383021;
  --word-ink:#efc887;
  --scrim:rgba(0,0,0,.58);
  --shadow:0 16px 44px rgba(0,0,0,.6);
  --app-shadow:0 0 40px rgba(0,0,0,.35);
  --header-bg:rgba(25,25,25,.88);
  --seg-shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.app{
  width:min(760px,100%);min-height:100vh;margin:0 auto;background:var(--paper);
  box-shadow:var(--app-shadow);
}

/* ---- shared list-row language -------------------------------------
   One row primitive used by the level picker, the settings disclosure
   and the episode table of contents, so all three read as the same
   control: [icon] [title / subtitle] [chevron]. Rows separate from the
   page by background alone — no hairline borders between them. */
.row{
  width:100%;display:flex;align-items:center;gap:11px;min-height:52px;
  border:0;border-radius:10px;background:var(--surface);color:var(--ink);
  padding:9px 11px;text-align:left;cursor:pointer;
  transition:background .13s ease;
}
.row:hover,.row:focus-visible{background:var(--surface-hover);outline:none}
.row:disabled{opacity:.42;cursor:default}
.row:disabled:hover{background:var(--surface)}
.row-flat{background:transparent;min-height:44px;padding:7px 8px}
.row-flat:hover,.row-flat:focus-visible{background:var(--surface)}
.row-list>.row+.row{margin-top:6px}
.row-icon{
  flex:0 0 30px;height:30px;border-radius:8px;background:var(--surface-strong);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;letter-spacing:-.02em;color:var(--muted);
}
.row-flat .row-icon{flex-basis:26px;height:26px;font-size:14px;background:transparent}
.row-main{flex:1;min-width:0}
.row-title{
  display:block;font-size:14.5px;font-weight:700;line-height:1.45;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-sub{
  display:block;margin-top:1px;font-size:12px;line-height:1.45;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-chev{flex:0 0 auto;color:var(--faint);font-size:17px;line-height:1;transition:transform .16s ease}
.row.open .row-chev{transform:rotate(90deg)}
.row-tag{
  display:inline-block;margin-left:7px;padding:1px 7px;border-radius:5px;
  background:var(--surface-strong);color:var(--faint);
  font-size:10.5px;font-weight:700;vertical-align:1px;
}
.section-label{
  margin:20px 2px 7px;font-size:11px;font-weight:700;letter-spacing:.06em;
  color:var(--faint);
}
.icon-btn{
  flex:0 0 auto;width:32px;height:32px;border:0;border-radius:8px;background:transparent;
  color:var(--muted);font-size:15px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--surface)}
#backToHub{font-size:20px}

/* ---- header ------------------------------------------------------- */
.topbar{
  position:sticky;top:0;z-index:20;padding:8px 12px 8px;
  background:var(--header-bg);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topline{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.brand{
  flex:1;min-width:0;font-size:13px;color:var(--muted);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;
}
/* Collapsed-by-default disclosure: everything that isn't the story
   itself (display mode, TOC) lives behind this one row, so opening a
   level lands you on prose, not on chrome. */
.settings-panel{display:none;padding:2px 2px 6px}
.settings-panel.open{display:block}
.settings-panel .section-label{margin-top:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;padding:3px;background:var(--surface);border-radius:10px}
.tab{
  border:0;background:transparent;border-radius:8px;padding:9px 6px;
  color:var(--faint);font-size:13px;font-weight:700;cursor:pointer;
}
.tab.active{background:var(--seg-active);color:var(--ink);box-shadow:var(--seg-shadow)}

/* ---- table of contents (nested children of the 목차 row) ---------- */
.toc-panel{display:none;margin:2px 0 0 19px;padding-left:8px;border-left:1px solid var(--line);max-height:44vh;overflow:auto}
.toc-panel.open{display:block}
.toc-item{
  width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;
  padding:9px 9px;border-radius:8px;text-align:left;cursor:pointer;color:var(--muted);
}
.toc-item:hover{background:var(--surface)}
.toc-item.active{background:var(--surface);color:var(--ink)}
.toc-num{flex:0 0 34px;color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.04em}
.toc-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- home / level picker ------------------------------------------ */
main{padding:18px 16px 88px}
.hub{padding:6px 0 8px}
.hub-head{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.hub-avatar{
  flex:0 0 38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;
}
.hub-names{flex:1;min-width:0}
.hub-title{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.hub-sub{color:var(--faint);font-size:12.5px;line-height:1.4}
.note-row{
  padding:13px 14px;border-radius:10px;background:var(--surface);
  color:var(--muted);font-size:12.5px;line-height:1.75;
}

/* ---- story view ---------------------------------------------------- */
.story-switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 12px;flex-wrap:wrap}
.story-chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.02em}
.story-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.difficulty-toggle{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--surface);border-radius:9px}
.diff-tab{border:0;background:transparent;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.diff-tab.active{background:var(--seg-active);color:var(--ink);box-shadow:var(--seg-shadow)}
.episode-nav{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.nav-btn{
  flex:0 0 auto;border:0;background:var(--surface);width:34px;height:34px;
  border-radius:8px;cursor:pointer;font-size:17px;line-height:1;color:var(--muted);
}
.nav-btn:hover:not(:disabled){background:var(--surface-hover)}
.nav-btn:disabled{opacity:.32;cursor:default}
.ep-center{flex:1;text-align:center;min-width:0}
.ep-count{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-title{font-size:13px;font-weight:700;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{margin:0 0 8px;font-size:26px;line-height:1.32;letter-spacing:-.03em;font-weight:800}
.guide{
  margin:0 0 24px;color:var(--faint);font-size:12.5px;line-height:1.6;
  padding-bottom:16px;border-bottom:1px solid var(--line);
}
/* The prose is the one place that stays generous — the density of the
   reference belongs to the chrome, not to the reading itself. */
.story p{margin:0 0 20px;font-size:17px;line-height:1.9;word-break:keep-all}
.word{
  display:inline;border:0;background:var(--word-bg);color:var(--word-ink);
  font-weight:400;font-size:1.1em;border-radius:4px;padding:1px 5px 2px;margin:0 1px;
  line-height:1.45;cursor:pointer;transition:background .13s ease;
}
.word:hover,.word:focus{background:var(--word-hover);outline:none}
.footer-info{
  margin-top:32px;padding-top:15px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;
  color:var(--faint);font-size:11.5px;
}
.bottom-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bottom-btn{
  border:0;background:var(--surface);border-radius:10px;
  padding:13px 10px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted);
}
.bottom-btn:hover:not(:disabled){background:var(--surface-hover)}
.bottom-btn:disabled{opacity:.32;cursor:default}

/* ---- word bottom sheet --------------------------------------------- */
.scrim{
  position:fixed;inset:0;z-index:40;background:var(--scrim);
  opacity:0;pointer-events:none;transition:.18s ease;
}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;z-index:50;width:min(760px,100%);
  transform:translate(-50%,110%);transition:.23s cubic-bezier(.2,.8,.2,1);
  background:var(--paper);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  max-height:88vh;overflow:auto;
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));
}
.sheet.open{transform:translate(-50%,0)}
.handle{width:36px;height:4px;border-radius:99px;background:var(--surface-strong);margin:0 auto 14px}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.label{display:block;margin-bottom:4px;color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.07em}
.kanji{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.close{
  flex:0 0 auto;width:32px;height:32px;border:0;border-radius:8px;background:var(--surface);
  color:var(--muted);font-size:18px;line-height:1;cursor:pointer;
}
.close:hover{background:var(--surface-hover)}
.reading{margin-top:12px;color:var(--muted);font-size:14px}
.meaning{margin-top:14px;padding:14px;border-radius:10px;background:var(--surface);font-size:16px;font-weight:700}
.sheet-mnemonic{margin-top:8px;padding:14px;border-radius:10px;background:var(--surface);font-size:14px;line-height:1.7;color:var(--ink)}

/* ---- mnemonic mode -------------------------------------------------- */
.mnemonic-wrap{display:none}.mnemonic-wrap.active{display:block}.story.hidden{display:none}
.mnemonic-note{margin:-6px 0 14px;padding:12px 14px;border-radius:10px;background:var(--surface);color:var(--faint);font-size:12px;line-height:1.7}
.mnemonic-grid{display:grid;grid-template-columns:1fr;gap:8px}
.mnemonic-card{border:0;border-radius:12px;padding:16px;background:var(--surface)}
.mnemonic-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mnemonic-word{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.mnemonic-reading{margin-top:4px;color:var(--faint);font-size:12.5px}
.mnemonic-meaning{flex:0 0 auto;background:var(--surface-strong);padding:5px 9px;border-radius:6px;font-size:12px;font-weight:700;color:var(--muted);max-width:48%;text-align:right}
.mnemonic-parts{margin-top:14px;font-size:13px;color:var(--muted)}
.mnemonic-memory{margin-top:7px;font-size:15px;font-weight:700;line-height:1.75;color:var(--ink)}
.word-badge{
  display:inline-flex;align-items:center;margin-left:7px;padding:2px 7px;border-radius:5px;
  background:var(--surface-strong);color:var(--faint);font-size:10px;font-weight:700;vertical-align:3px;
}
.word-badge.today{background:var(--accent-soft);color:var(--accent)}
.kanji-breakdown{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.kanji-breakdown-title{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.07em;margin-bottom:8px}
.kanji-row{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.kanji-row:last-child{border-bottom:0}
.kanji-char{font-size:24px;font-weight:800;line-height:1.1;text-align:center;background:var(--surface-strong);border-radius:8px;padding:7px 0}
.kanji-detail{font-size:13px;line-height:1.65;color:var(--muted)}
.kanji-detail strong{color:var(--ink);font-weight:700}
.word-mnemonic-title{margin-top:12px;font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.07em}
.word-mnemonic-text{margin-top:5px;font-size:15px;font-weight:700;line-height:1.75;color:var(--ink)}
.sheet .kanji-row{grid-template-columns:36px 1fr;padding:7px 0}
.sheet .kanji-char{font-size:21px;padding:6px 0;background:var(--surface-strong)}
.sheet .kanji-detail{font-size:12.5px}

@media (max-width:430px){
  main{padding-left:14px;padding-right:14px}
  .story p{font-size:16.5px}
  h1{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar" style="display:none">
    <div class="topline">
      <button class="icon-btn" id="backToHub" type="button" aria-label="급수 선택으로">‹</button>
      <div class="brand" id="brandLabel"></div>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="테마 전환">🌙</button>
    </div>
    <button class="row row-flat" id="settingsTrigger" type="button" aria-expanded="false" aria-controls="settingsPanel">
      <span class="row-icon">⚙</span>
      <span class="row-main"><span class="row-title">보기 설정 · 목차</span></span>
      <span class="row-chev">›</span>
    </button>
    <div class="settings-panel" id="settingsPanel">
      <div class="section-label">표기 방식</div>
      <div class="tabs" role="tablist" aria-label="표기 방식">
        <button class="tab active" id="kanjiTab" type="button">한자로 보기</button>
        <button class="tab" id="hangulTab" type="button">한글발음</button>
        <button class="tab" id="mnemonicTab" type="button">연상법</button>
      </div>
      <div class="section-label">스토리 목차</div>
      <button class="row row-flat" id="tocTrigger" type="button" aria-expanded="false" aria-controls="tocPanel">
        <span class="row-icon">☰</span>
        <span class="row-main"><span class="row-title">에피소드 목록</span></span>
        <span class="row-chev">›</span>
      </button>
      <div class="toc-panel" id="tocPanel"></div>
    </div>
  </header>

  <main>
    <section id="hubView" class="hub">
      <div class="hub-head">
        <div class="hub-avatar">단</div>
        <div class="hub-names">
          <div class="hub-title">단어 스릴러</div>
          <div class="hub-sub">이야기로 외우는 일본어 단어</div>
        </div>
        <button class="icon-btn" id="themeToggleHub" type="button" aria-label="테마 전환">🌙</button>
      </div>
      <div class="section-label">급수</div>
      <div class="row-list" id="levelGrid"></div>
      <div class="section-label">읽는 법</div>
      <div class="note-row">단어를 누르면 읽는 법 · 뜻 · 한자별 연상법이 아래에서 열려요. N5는 요일마다 이야기가 바뀌고, 오늘 요일의 이야기만 열립니다.</div>
    </section>

    <div id="storyView" style="display:none">
      <div class="story-switch" id="storySwitch"></div>
      <div class="episode-nav">
        <button class="nav-btn" id="prevTop" aria-label="이전화">‹</button>
        <div class="ep-center">
          <div class="ep-count" id="epCount"></div>
          <div class="ep-title" id="epMiniTitle"></div>
        </div>
        <button class="nav-btn" id="nextTop" aria-label="다음화">›</button>
      </div>

      <h1 id="title"></h1>
      <div class="guide" id="guideText"></div>
      <article class="story" id="story"></article>
      <section class="mnemonic-wrap" id="mnemonicWrap">
        <div class="mnemonic-note">각 단어를 한자 하나씩 쪼개서 기억한 뒤, 마지막에 단어 전체 이미지를 연결해요. 아래 내용은 암기용 시각 연상이며 정식 한자 어원 설명과는 다를 수 있습니다.</div>
        <div class="mnemonic-grid" id="mnemonicGrid"></div>
      </section>

      <div class="footer-info">
        <span id="episodeWordCount"></span>
        <span id="totalLabel"></span>
      </div>
      <div class="bottom-nav">
        <button class="bottom-btn" id="prevBottom">← 이전 화</button>
        <button class="bottom-btn" id="nextBottom">다음 화 →</button>
      </div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-hidden="true">
  <div class="handle"></div>
  <div class="sheet-top">
    <div>
      <span class="label">단어</span>
      <div class="kanji" id="sheetKanji"></div>
    </div>
    <button class="close" id="closeSheet" aria-label="닫기">×</button>
  </div>
  <div class="reading" id="sheetReading"></div>
  <div class="meaning" id="sheetMeaning"></div>
  <div class="sheet-mnemonic" id="sheetMnemonic"></div>

:{"parts":"끈을 순서대로 감아 내려가는 모양","memory":"차례를 따라 아래로 이어지는 사람 → 남동생."},"妹":{"parts":"女(여자) + 未(아직)","memory":"아직 다 자라지 않은 여자아이 → 여동생."},"子":{"parts":"포대기에 싸인 아기 모양","memory":"포대기 속에 싸인 작은 아기 → 아이."},"供":{"parts":"亻(사람) + 共(함께)","memory":"사람들과 함께 있는 어린 존재 → 아이, 딸리다."},"友":{"parts":"맞잡은 두 손 모양","memory":"손을 맞잡은 사이 → 벗."},"達":{"parts":"辶(길) + 羊(양)","memory":"양 떼가 길을 따라 무사히 도착한다 → 이르다, 무리."},"学":{"parts":"冖(지붕) + 子(아이)","memory":"지붕 아래 아이가 앉아 배운다 → 배우다."},"男":{"parts":"田(밭) + 力(힘)","memory":"밭에서 힘을 쓰는 사람 → 남자."},"人":{"parts":"두 다리로 서 있는 사람 모양","memory":"두 발로 곧게 선 모습 → 사람."},"女":{"parts":"두 손을 모으고 앉은 모양","memory":"다소곳이 앉아 있는 모습 → 여자."},"外":{"parts":"夕(저녁) + 卜(점치다)","memory":"저녁에 점을 치러 밖으로 나간다 → 바깥."},"国":{"parts":"囗(테두리) + 玉(옥)","memory":"테두리 안에 소중한 옥을 지킨다 → 나라."},"皆":{"parts":"比(나란히) + 白(밝다)","memory":"모두가 나란히 밝은 곳에 모인다 → 모두, 다."},"校":{"parts":"木(나무) + 交(교차하다)","memory":"나무 기둥들이 교차해 세워진 건물 → 학교."},"大":{"parts":"팔다리를 벌리고 선 사람 모양","memory":"양팔을 크게 벌린 사람 → 크다."},"教":{"parts":"손에 회초리를 든 옛 모양","memory":"아이 앞에서 하나하나 가르침을 내린다 → 가르치다."},"室":{"parts":"宀(지붕) + 至(이르다)","memory":"지붕 아래 이르러 머무는 작은 공간 → 방."},"図":{"parts":"囗(테두리) + 안쪽의 도면","memory":"테두리 안에 그림을 그려 넣는다 → 그림, 도면."},"書":{"parts":"聿(붓) + 曰(말하다)","memory":"붓을 쥐고 하고 싶은 말을 적는다 → 글."},"館":{"parts":"食(음식) + 官(관청)","memory":"손님에게 음식을 대접하는 큰 건물 → 집, 기관."},"宿":{"parts":"宀(지붕) + 亻(사람) + 百(자리)","memory":"지붕 아래 사람이 자리를 잡고 묵는다 → 묵다, 숙소."},"題":{"parts":"是(옳다) + 頁(머리)","memory":"옳은 답을 찾으라며 던지는 물음 → 제목, 문제."},"試":{"parts":"言(말) + 式(방식)","memory":"정해진 방식대로 말해 보게 한다 → 시험하다."},"験":{"parts":"馬(말) + 僉(모두 살피다)","memory":"말을 하나하나 살펴 실력을 잰다 → 시험, 겪다."},"授":{"parts":"扌(손) + 受(받다)","memory":"손에서 손으로 무언가를 건넨다 → 주다, 가르치다."},"業":{"parts":"북과 도구를 늘어놓은 모양","memory":"도구를 늘어놓고 일에 몰두한다 → 일, 업."},"勉":{"parts":"免(벗어나다) + 力(힘)","memory":"힘을 다해 어려움에서 벗어나려 애쓴다 → 힘쓰다."},"強":{"parts":"弓(활) + 虫(벌레의 강한 생명력)","memory":"활처럼 팽팽하고 질긴 힘 → 강하다."},"会":{"parts":"뚜껑이 그릇을 덮는 모양","memory":"여럿이 한데 모여 뚜껑처럼 둘러앉는다 → 모이다."},"社":{"parts":"示(제단) + 土(땅)","memory":"땅 위 제단 앞에 사람들이 모인다 → 모임, 단체."},"仕":{"parts":"亻(사람) + 士(선비)","memory":"사람이 윗사람을 섬기며 일한다 → 섬기다, 일하다."},"事":{"parts":"손에 붓을 쥐고 일을 기록하는 모양","memory":"손으로 일을 기록해 나간다 → 일, 사건."},"医":{"parts":"화살통 안에 든 도구 모양","memory":"상처를 치료하는 도구를 담은 상자 → 의술, 의사."},"者":{"parts":"老(늙다)의 변형 + 日","memory":"오랜 시간 어떤 일을 해온 사람 → 사람, ~하는 이."},"部":{"parts":"咅(나누다) + 阝(고을)","memory":"고을을 여러 구역으로 나눈다 → 부분, 곳."},"屋":{"parts":"尸(몸) + 至(이르다)","memory":"몸이 이르러 머무는 지붕 밑 공간 → 방, 집."},"病":{"parts":"疒(병들어 눕다) + 丙","memory":"몸이 병들어 자리에 눕는다 → 병."},"院":{"parts":"阝(담장) + 完(완전히 둘러싸다)","memory":"담장으로 둘러싸인 커다란 건물 → 집, 기관."},"銀":{"parts":"金(쇠) + 艮(단단하다)","memory":"단단하고 하얗게 빛나는 귀한 금속 → 은."},"行":{"parts":"네 갈래 길이 교차하는 모양","memory":"사거리를 걸어 나아간다 → 가다, 행하다."},"郵":{"parts":"垂(드리우다) + 阝(마을)","memory":"멀리 늘어진 소식을 마을로 전달한다 → 우편."},"便":{"parts":"亻(사람) + 更(바꾸다)","memory":"사람이 더 편하게 움직일 수 있게 한다 → 편리, 소식."},"局":{"parts":"尺(자) + 口(구역)","memory":"정해진 구역을 자로 재어 관리하는 곳 → 국, 기관."},"駅":{"parts":"馬(말) + 尺(자로 잰 거리)","memory":"말을 갈아타던 일정한 거리의 정류장 → 역."},"店":{"parts":"广(지붕) + 占(자리를 차지하다)","memory":"지붕 아래 한자리 차지하고 물건을 판다 → 가게."},"公":{"parts":"八(나누다) + 厶(사사로움)","memory":"사사로움을 나누어 모두에게 공평하게 한다 → 공공의."},"園":{"parts":"囗(테두리) + 袁(옷자락처럼 넓게 두르다)","memory":"테두리를 둘러 넓게 가꾼 땅 → 동산, 공원."},"隣":{"parts":"阝(마을) + 粦(반짝이는 불빛)","memory":"옆 마을에서도 불빛이 반짝여 보인다 → 이웃."},"台":{"parts":"厶(사사로이) + 口(입)","memory":"혼자 올라서서 말하는 자리 → 대, 받침."},"所":{"parts":"戸(문) + 斤(도끼)","memory":"문 앞에 도끼를 세워 둔 자리 → 곳, 장소."},"玄":{"parts":"실을 검게 물들인 모양","memory":"실이 검게 물들어 아득해 보인다 → 검다, 아득하다."},"関":{"parts":"門(문) + 빗장을 지른 모양","memory":"문에 빗장을 걸어 잠근다 → 관계, 관문."},"庭":{"parts":"广(지붕) + 廷(뜰)","memory":"지붕 아래 딸린 넓은 뜰 → 정원, 마당."},"工":{"parts":"자와 곱자를 겹친 모양","memory":"자를 대고 반듯하게 만든다 → 만들다, 장인."},"場":{"parts":"土(땅) + 昜(햇볕)","memory":"햇볕 잘 드는 넓은 땅 → 장소, 마당."},"建":{"parts":"廴(길게 걷다) + 聿(붓·자)","memory":"먹줄을 길게 늘여 반듯하게 짓는다 → 세우다."},"物":{"parts":"牛(소) + 勿(여러 색)","memory":"여러 빛깔의 소, 세상의 온갖 것 → 물건."},"道":{"parts":"辶(길) + 首(머리)","memory":"머리를 앞세우고 나아가는 길 → 길, 도리."},"橋":{"parts":"木(나무) + 喬(높이 솟다)","memory":"나무로 높이 걸쳐 놓은 것 → 다리."},"町":{"parts":"田(밭) + 丁(구획)","memory":"밭을 반듯하게 구획해 이룬 동네 → 마을."}},"todayWords":["今日","明日","昨日","今","朝","昼","夜","今週","来週","先週","今月","来月","先月","今年","来年","去年","毎日","毎朝","毎晩","時間","誕生日","週間","半","分","家族","父","母","お父さん","お母さん","兄","姉","弟","妹","子供","友達","先生","学生","男の人","女の人","外国人","皆さん","学校","大学","教室","図書館","宿題","試験","授業","勉強","会社","仕事","医者","家","部屋","病院","銀行","郵便局","駅","店","公園","隣","台所","玄関","庭","工場","建物","道","橋","町","国"],"dayBasedReview":true,"stories":[{"key":"mon","label":"월요일","days":[1],"modes":{"basic":{"title":"형이 사라진 시간","episodes":[{"title":"1화 · 형이 사라진 아침","body":["[[今日]] 아침, [[家族]] 단톡방에 [[父]]가 남긴 메시지 한 줄이 떠 있었다. \"형 어디 있는지 아는 사람?\"","[[昨日]] [[夜]]까지만 해도 [[兄]]은 분명 [[部屋]]에 있었다. [[今]] 문을 열어 보니 이불만 덩그러니 접혀 있고 사람은 없었다.","[[朝]] [[時間]]이 얼마 남지 않았지만 나는 [[母]]에게 물었다. \"형 [[明日]] 시험이라고 하지 않았어?\"","[[母]]는 대답 대신 오래된 [[子供]] 때 사진첩을 꺼내 조용히 뒤적였다. 평소와 다른 이상한 반응이었다.","나는 [[友達]]에게 [[家]] 앞에서 만나자고 문자를 보냈다. 형에 대해 뭔가 알고 있을지도 몰랐다.","친구는 뜻밖의 말을 했다. \"네 형, 어제 [[昼]]에 학교 앞에서 이상한 사람이랑 얘기하는 거 봤어.\"","\"이상한 사람?\" 나는 되물었다. 친구는 고개를 끄덕이며 시계를 봤다. 지금은 정확히 7시 [[半]]이었다.","[[父]]는 벌써 [[会社]]에 전화를 걸어 오늘 하루 자리를 비우겠다고 말하고 있었다. 우리 가족이 이렇게 조용히 무너지는 걸 처음 봤다.","나는 형의 [[部屋]]으로 다시 들어갔다. 책상 위에 어제 날짜가 적힌 메모 한 장이 남아 있었다. '학교 끝나고 [[隣]] 동네로 간다.'"]},{"title":"2화 · 학교에 남은 흔적","body":["[[今週]]는 유난히 조용했다. [[学校]]에 도착하자마자 나는 형의 [[教室]]로 향했다.","[[先生]]님은 형이 [[先週]]부터 [[授業]]에 잘 나오지 않았다고 했다. \"[[勉強]]는 늘 열심히 하던 [[学生]]인데, 요즘은 좀 달랐어.\"","[[図書館]]에서 사서 선생님이 형이 자주 빌리던 책을 [[毎日]] 같은 시간에 반납했다고 알려줬다.","책 사이에서 [[宿題]] 종이 한 장이 나왔다. 뒷면에는 낯선 주소가 적혀 있었다.","나는 [[姉]]에게 전화를 걸었다. 자취 중인 누나라면 뭔가 알지도 몰랐다.","누나는 [[弟]]인 나보다 먼저 알고 있었다는 듯 침착하게 말했다. \"[[妹]]한테는 말하지 마. 나도 [[毎朝]] 형한테 연락 오는 척했을 뿐이야.\"","심장이 내려앉았다. 형은 벌써 며칠째 가족 모두를 속이고 있었다는 뜻이었다."]},{"title":"3화 · 마을을 가로질러","body":["나는 메모에 적힌 주소를 들고 [[隣]] 동네로 향했다. [[公園]]을 가로질러 [[駅]] 쪽으로 걷는 길이었다.","[[道]] 끝에 놓인 오래된 [[橋]]를 건너자 낯선 [[町]]이 나왔다. 형이 왜 굳이 여기까지 왔는지 알 수 없었다.","작은 [[店]] 주인은 형을 기억하고 있었다. \"그 학생, [[昼]] 지나서 [[国]] 이름이 적힌 편지봉투를 사갔어.\"","[[銀行]] 앞을 지날 때, [[郵便局]] 직원이 나를 불러 세웠다. \"혹시 이 학생 동생이세요? 어제 여기서 뭔가 부치고 갔어요.\"","근처 [[建物]] 뒤편에서 형이 자주 앉아 있었다는 벤치를 발견했다. 벤치 옆에는 [[夜]]에도 켜져 있는 작은 가로등이 있었다."]},{"title":"4화 · 병원 뒤편","body":["편지 봉투에 적힌 곳은 [[病院]] 근처였다. [[医者]] 선생님 한 분이 나를 알아보고 다가왔다. \"형 되시죠? 어제 이 근처 [[工場]]에서 일할 수 있냐고 물어봤었어요.\"","형이 [[仕事]]를 구하고 있었다는 뜻이었다. [[大学]] [[試験]]을 포기하려던 걸까.","병원 뒤편, 작은 [[台所]]가 딸린 쪽방이 있었다. [[玄関]] 앞에는 낡은 신발 한 켤레가 가지런히 놓여 있었다.","[[庭]]을 가로질러 다가가는데 안에서 인기척이 들렸다. 나는 숨을 죽이고 문을 두드렸다.","문이 열리자 그 안엔 형이 아니라 낯선 [[男の人]]이 서 있었다. \"누구세요?\" 그가 먼저 물었다.","[[誕生日]] 카드가 테이블 위에 놓여 있었다. 내 이름이 적혀 있었다. [[今年]] 내 생일은 아직 오지 않았는데.","남자는 [[去年]]부터 형과 알고 지낸 사람이라고 했다. \"[[来年]] 같이 사업을 시작하기로 했어요. 형이 미리 준비하던 깜짝 선물이 저 카드예요.\""]},{"title":"5화 · 완성된 카드","body":["[[今月]] 말, 형이 드디어 [[家]]로 돌아왔다. [[来月]]이면 새 [[仕事]]를 시작한다며 웃었다.","[[先月]]부터 혼자 준비해온 일이라 아무에게도 말하지 못했다고 했다. [[来週]]에는 [[家族]] 모두를 데리고 그 [[工場]]을 구경시켜주겠다고 했다.","[[母]]는 [[毎晩]] 형 걱정에 잠을 설쳤다고 했다. 형은 미안하다며 [[週間]] 내내 집안일을 도맡아 하기로 약속했다.","나는 [[半]] 농담으로 물었다. \"그래서 그 카드에 왜 내 이름 적어놨어?\" 형은 [[分]] 단위로 계산한 듯 정확한 타이밍에 대답했다. \"네 [[誕生日]]에 제일 먼저 보여주려고 했지.\"","\"[[皆さん]]...\" 형이 [[外国人]] 동료들 앞에서 우리 가족을 소개하는 연습을 하고 있었다. 서툴지만 진지한 목소리였다.","[[女の人]] 한 명이 문 앞에서 손을 흔들었다. 형의 새 동료라고 했다. [[お父さん]]과 [[お母さん]]도 그제야 활짝 웃었다.","그날 [[夜]], 우리는 오랜만에 다 같이 저녁을 먹었다. 사라졌던 [[時間]]만큼, 이야기할 것도 많았다."]}]},"hard":{"title":"없어진 자리","episodes":[{"title":"1화 · 없어진 자리 (하드모드)","body":["[[今日]] [[朝]] 여섯 시. 문자 한 줄. 발신 [[兄]].","[[昨日]] [[夜]]: 있었다. [[今]]: 없다.","[[家族]] 넷. [[父]] [[母]] [[兄]] 나. [[今日]] 셋.","[[兄]] [[部屋]]. 이불. [[家]] 안. [[台所]] [[玄関]] [[庭]]. 전부 비었다.","[[時間]] 확인. 일곱 시 [[半]]. 십 [[分]] 뒤 또 [[半]].","\"[[明日]] [[試験]]?\" [[母]]. 무응답. [[子供]] 때 사진첩만.","[[父]]: [[会社]]. [[仕事]]. [[今]] 부재."]},{"title":"2화 · 빈 자리 하나","body":["[[学校]]. [[教室]]. 빈 책상 하나.","[[先生]]: \"[[先週]]부터 [[授業]] 결석.\"","[[学生]] 명단. [[宿題]] 미제출. [[試験]] 결시. [[勉強]] 기록만 성실.","[[図書館]] 반납대. 같은 책. [[毎日]] 같은 [[時間]].","[[友達]]: \"[[今週]] 내내 없었어.\"","[[姉]]는 알았다. [[弟]]인 나만 몰랐다. [[妹]]에겐 함구.","[[姉]]: \"[[毎朝]] [[兄]] 이름으로 문자 보냈어. [[毎晩]]도.\""]},{"title":"3화 · 옆 동네까지","body":["메모 한 장. [[隣]] [[町]].","[[道]]. [[橋]]. [[公園]]. [[駅]]. 순서대로.","[[昼]]. [[店]]. 주인이 [[兄]]을 기억. 봉투.","[[銀行]] 앞. [[郵便局]] 직원: \"[[昨日]] 여기서 부쳤어요.\"","봉투: [[国]] 이름 하나. [[大学]] 이름 하나.","[[建物]] 뒤 벤치. [[兄]]의 자리."]},{"title":"4화 · 카드 위의 이름","body":["[[病院]]. [[医者]]: \"[[工場]] 위치를 물었어요.\"","[[会社]] 아님. [[工場]]. [[仕事]] 선택.","쪽방. [[台所]]. [[玄関]]. [[庭]]. 신발 한 켤레.","문. [[男の人]]. 뒤에 [[女の人]]. 둘 다 [[外国人]].","탁자 위 카드. 내 이름. [[誕生日]]. [[今年]] 생일은 아직.","\"[[去年]]부터 알던 사이. [[来年]] 같이 시작.\"","[[先月]] 준비. [[今月]] 말 귀가. [[来月]] 출근. [[来週]] 통보.","한 [[週間]]. [[母]]가 [[毎晩]] 센 밤.","[[お父さん]] [[お母さん]] 둘 다 웃음. \"[[皆さん]], 늦어서 죄송합니다.\" [[兄]]은 그 인사를 연습 중이었다."]}]}}},{"key":"tue","label":"화요일","days":[2],"modes":{"basic":{"title":"똑같은 하루","episodes":[{"title":"1화 · 다시, 아침","body":["[[今日]] 아침, 눈을 뜨자마자 이상한 기분이 들었다. [[今]] 이 순간이 [[昨日]]이랑 모든 게 똑같았다.","[[家族]] 모두 [[朝]]마다 하던 그대로 움직이고 있었다. [[仕事]]하러 나서는 [[父]]는 신문을 넘기고, [[母]]는 [[台所]]에서 국을 끓였다.","[[姉]]는 [[毎日]] 같은 순서로 화장을 하고 있었다. [[兄]]에게 물었다. \"형, 오늘 [[明日]]인 것 같지 않아?\" 형은 이상한 표정으로 나를 봤다.","[[妹]]는 어제와 똑같이 [[宿題]]를 잊어버렸다며 울먹였다. 그 옆에서 어린 [[子供]] 시절 사진 속 나와 똑같은 표정을 짓고 있었다.","[[時間]]을 확인했다. 정확히 7시 [[半]], 1[[分]]도 틀리지 않았다. 어제 이 시각에도 같은 방송이 라디오에서 흘러나오고 있었다.","[[友達]]에게 문자를 보냈다. \"너도 오늘 [[昨日]]이랑 똑같이 느껴져?\" 답은 오지 않았다."]},{"title":"2화 · 학교의 반복","body":["[[学校]]에 가는 길, [[駅]] 앞 [[店]] 주인이 어제와 똑같은 인사를 건넸다. 단어 하나까지 똑같았다.","[[教室]]에서 [[先生]]님은 [[授業]] 중 어제와 똑같은 농담을 했다. 반 [[学生]]들도 어제와 똑같이 웃었다.","그중 [[女の人]] 한 명만 웃지 않고 나를 빤히 쳐다보고 있었다. 처음 보는 얼굴이었다.","[[勉強]] 시간이 끝나고 [[図書館]]으로 향했다. [[試験]] 기간이라 다들 조용히 앉아 있었다.","그 여자아이가 다가와 속삭였다. \"너도 느꼈지? [[今週]] 내내 오늘만 반복되고 있어.\"","\"[[先週]]부터야.\" 그녀가 말했다. \"[[毎朝]] 같은 시간에 깨서, [[毎晩]] 같은 꿈을 꿔.\""]},{"title":"3화 · 동네를 벗어나","body":["[[昼]]가 되어도 하늘 색까지 어제와 같았다. 우리는 [[公園]]을 가로질러 [[町]] 반대편으로 걸었다. 뭔가 다른 걸 해봐야 했다.","[[隣]] 동네로 넘어가는 [[橋]]를 건넜다. 다리를 건너는 순간만은 처음 겪는 기분이었다.","[[道]] 끝에 낯선 [[建物]]이 서 있었다. [[会社]] 간판이 붙어 있었는데, 어제는 분명 없었던 곳이었다.","[[銀行]]과 [[郵便局]] 사이, 좁은 골목에서 여자아이가 걸음을 멈췄다. \"여기, [[今年]] 처음 보는 가게야.\"","우리는 [[国]] 이름이 적힌 낡은 표지판을 발견했다. 어제까지는 이 골목 자체를 몰랐다."]},{"title":"4화 · 병원 옆 공터","body":["표지판을 따라가자 [[病院]] 옆 공터가 나왔다. [[医者]] 한 명이 담배를 피우며 서 있었다.","\"[[去年]]에도 여기서 똑같은 애들을 본 것 같은데.\" 의사가 중얼거렸다. 나와 여자아이는 서로 마주 보았다.","[[工場]] 굴뚝에서 연기가 피어올랐다. [[大学]]생으로 보이는 [[男の人]] 몇 명이 그 앞에서 뭔가를 적고 있었다.","[[庭]]처럼 꾸며진 작은 공터 안쪽에 [[玄関]]만 남은 무너진 집이 있었다. 문패에는 내 [[誕生日]]과 같은 숫자가 적혀 있었다.","\"[[皆さん]] 주의\"라고 적힌 낡은 안내판이 바람에 흔들렸다. [[外国人]] 노동자들이 예전에 이 공사를 했다는 표시였다.","[[来年]] 완공 예정이라는 글자 위로, 오늘 날짜가 겹쳐 적혀 있었다. 우리는 그 자리에 얼어붙었다."]},{"title":"5화 · 다음 날","body":["저 멀리서 진짜 우리 [[お父さん]]의 목소리가 들렸다. [[父]]가 아니라, 분명 오늘의 아버지였다.","집으로 뛰어가는 길, [[家]] 앞에서 [[お母さん]]이 기다리고 있었다. 평소와 다른, 조금 지친 얼굴이었다.","[[部屋]]으로 들어가 눈을 감았다 떴다. 창밖은 여전히 [[今日]]이었지만, 어딘가 미묘하게 달라져 있었다.","[[弟]]가 처음 보는 장난감을 들고 뛰어들어왔다. [[先月]]에는 분명 없던 물건이었다.","[[来月]]이면 이 동네에 새 [[学校]]가 생긴다는 소식이 뉴스에 나왔다. 어제까지는 없던 뉴스였다.","[[週間]] 내내 반복되던 하루가, 아주 조금씩 앞으로 나아가고 있었다. [[来週]]도, [[今月]]도 이제는 정말 다가올 것 같았다. 나는 처음으로 마음을 놓고 [[夜]]를 맞았다."]}]},"hard":{"title":"같은 아침, 다시","episodes":[{"title":"1화 · 같은 아침, 다시 (하드모드)","body":["[[今日]]. [[昨日]]과 동일. [[今]]도.","[[朝]] 일곱 시 [[半]]. 라디오. 같은 곡. 일 [[分]] 오차 없음.","[[家族]]. [[父]]: 신문. [[母]]: [[台所]]. [[姉]]: 화장. [[兄]]: 침묵.","[[妹]]: [[宿題]] 분실, 울음. [[弟]]: 웃음. [[昨日]]도 동일.","[[子供]] 때 사진. [[家族]] 전원. 표정까지 동일.","[[父]]의 [[仕事]]. [[会社]]. [[毎日]] 같은 출근. [[毎朝]] 같은 문. [[時間]]만 제자리.","\"[[今日]]이 [[明日]] 아냐?\" [[友達]] 전송. 무응답. [[昨日]]도. [[先週]]도."]},{"title":"2화 · 반복되는 교실","body":["[[家]] → [[駅]] → [[店]]. 주인 인사. 단어까지 동일.","[[学校]]. [[教室]]. [[先生]]. [[授業]]. 같은 농담. [[学生]]들 같은 웃음.","[[学生]] 중 한 명만 정지. 처음 보는 [[女の人]].","[[勉強]] 종료. [[図書館]]. [[試験]] 기간. [[学校]] 전체 정적.","그 애: \"[[今週]] 전부 [[今日]]이야.\"","\"[[先週]]부터. [[毎朝]] 같은 [[時間]]에 깨고 [[毎晩]] 같은 꿈.\""]},{"title":"3화 · 동네 밖으로","body":["[[昼]]. [[今日]]도 하늘색 동일. [[昨日]]과 [[分]] 단위로 동일.","[[公園]]. [[町]] 반대편. [[隣]] 동네. [[橋]].","[[橋]] 위. 그 [[分]]만 처음이었다.","[[道]] 끝. 낯선 [[建物]]. [[会社]] 간판. [[昨日]] 부재.","[[銀行]]과 [[郵便局]] 사이. 골목. 그 애: \"[[今年]] 처음 봐.\"","표지판. [[国]] 이름. [[家]] 귀가 취소."]},{"title":"4화 · 공터, 그리고 내일","body":["[[病院]] 옆 공터. [[医者]]. 담배.","\"[[去年]]에도 너희 봤는데.\" 침묵.","[[工場]] 굴뚝. 연기. [[大学]]생 같은 [[男の人]] 셋. 기록 중.","[[庭]] 같은 공터. 무너진 [[家]]. [[玄関]]만 잔존.","문패 숫자 = 내 [[誕生日]].","안내판: \"[[皆さん]] 주의.\" [[外国人]] 노동자 시공. [[来年]] 완공 예정.","그 위에 [[今日]] 날짜.","[[家]] 귀가. [[お父さん]] 목소리. [[お母さん]] 얼굴. 처음 보는 얼굴.","[[部屋]]. 눈 감았다 뜸. [[先月]]엔 없던 장난감. [[来月]] 전학. [[学校]] 변경.","한 [[週間]] 멈췄던 하루가 움직였다. [[来週]]도 [[今月]]도 온다. [[夜]]가 왔다."]}]}}},{"key":"wed","label":"수요일","days":[3],"modes":{"basic":{"title":"옆집 소리","episodes":[{"title":"1화 · 옆집 소리","body":["[[隣]] [[部屋]]에서 밤마다 이상한 소리가 났다. [[夜]]마다 벽을 두드리는 듯한 소리였다.","[[父]]와 [[母]]는 [[毎晩]] 그 소리를 듣고도 아무 말이 없었다. [[毎日]] 못 들은 척하는 게 이상했다.","[[姉]]에게 물어보니 이미 [[先月]]부터 알고 있었다고 했다. \"[[家族]]끼리 그 얘기는 안 하기로 했어.\" [[兄]]도 옆에서 고개를 끄덕였다.","[[今日]] [[朝]]에도 소리는 계속됐다. [[今]]도 여전히 들렸다. [[時間]]을 재보니 정확히 [[半]]마다 한 번씩이었다.","[[妹]]는 무섭다며 [[誕生日]] 선물로 받은 인형을 꼭 껴안고 있었다. [[弟]]는 오히려 그 소리를 흉내 내며 놀았다."]},{"title":"2화 · 학교에서 들은 이야기","body":["[[学校]] [[教室]]에서 [[友達]]에게 그 얘기를 꺼냈다. 친구는 [[今週]] 내내 소문이 돌고 있다고 했다.","\"[[先生]]님도 아신대. [[先週]]에 그 [[部屋]] 주인이 [[病院]]에 실려 갔다더라.\"","[[授業]] 시간, [[学生]]들 사이에서 그 [[町]] 이야기가 은밀하게 퍼졌다. [[宿題]]도 [[勉強]]도 아무도 귀에 들어오지 않는 눈치였다.","[[図書館]] 사서 [[女の人]]이 오래된 신문을 꺼내 보여줬다. [[去年]] 그 옆집에서 [[医者]]가 다녀갔다는 기록이었다.","\"[[試験]] 끝나고 같이 가볼래?\" 친구가 물었다. [[明日]]로 미룰까 하다가, [[今年]] 들어 처음으로 겁이 아니라 궁금증이 앞서서 [[昨日]]처럼 미루지 않기로 했다."]},{"title":"3화 · 골목을 따라","body":["[[道]]를 따라 걷다가 [[橋]]를 건너 [[隣]] [[町]]까지 갔다. [[国]] 밖에서 온 듯한 낯선 [[建物]] 하나가 눈에 띄었다.","[[公園]] 앞 [[店]] 주인이 우리를 알아봤다. \"그 집 아들, [[大学]] [[会社]]에 다니다가 [[仕事]]를 그만뒀댔지.\"","[[駅]] 쪽으로 걷다가 [[銀行]]과 [[郵便局]] 사잇길에서 [[男の人]] 한 명과 마주쳤다. 낯빛이 창백했다.","그는 [[皆さん]]이 오해하고 있다며 손을 내저었다. \"[[外国人]] 노동자 숙소였을 뿐이에요, [[来年]]이면 다 헐릴 곳이고요.\"","믿기 어려웠지만, 그의 [[お父さん]]이 그 [[工場]]의 옛 관리인이었다는 사실만은 확실해 보였다."]},{"title":"4화 · 진짜 이유","body":["우리는 그 사람을 따라 [[庭]]이 딸린 작은 [[家]]로 들어갔다. [[玄関]]에는 오래된 신발 여러 켤레가 놓여 있었다.","[[台所]]에서 [[お母さん]]으로 보이는 [[女の人]] 한 명이 우리를 맞았다. 벽 두드리는 소리의 정체를 알려주겠다고 했다.","\"[[毎朝]] 저희 [[子供]]가 배관을 고치는 연습을 해요. [[医者]]가 재활 운동으로 권한 거예요.\"","허무하리만치 단순한 이유였다. 우리는 [[週間]] 내내 무서워했던 게 부끄러워졌다.","돌아오는 길, [[分]] 단위로 시간을 확인하던 습관이 그제야 사라졌다."]},{"title":"5화 · 다시 조용한 밤","body":["[[来月]]이면 그 집 [[子供]]은 재활을 마친다고 했다. 소리도 곧 멈출 거라는 뜻이었다.","[[今月]] 안으로 우리 [[家族]]도 그 집에 인사를 가기로 했다. [[父]]는 왜 진작 묻지 않았는지 겸연쩍어했다.","[[来週]]에는 다 같이 저녁을 먹기로 했다. [[皆さん]]이라는 말이 이렇게 따뜻하게 들린 적이 없었다.","그날 [[夜]], [[隣]] [[部屋]]에서 들려오는 소리가 더는 무섭지 않았다. 오히려 조금 응원하는 마음이 들었다.","[[昼]]와 [[夜]]가 몇 번 더 지나고, 정말로 소리는 잦아들었다. 우리는 그 [[時間]]을 함께 기다려 준 셈이었다."]}]},"hard":{"title":"벽 너머","episodes":[{"title":"1화 · 벽 너머 (하드모드)","body":["[[隣]] [[部屋]]. 벽. 두드림.","[[夜]]. [[毎晩]]. [[毎日]]. 정지 없음.","[[父]] [[母]] 둘 다 무반응. [[家族]] 규칙.","[[姉]]: [[先月]]부터 인지. [[兄]]도.","[[今日]] [[朝]]에도. [[今]]도.","[[時間]] 측정. [[半]]마다 1회. 오차 몇 [[分]].","[[妹]]: [[誕生日]] 인형 껴안고 취침. [[弟]]: 그 소리 흉내."]},{"title":"2화 · 소문","body":["[[学校]]. [[教室]]. [[友達]]. [[今週]] 내내 소문.","\"[[先生]]도 안대. [[先週]]에 그 [[家]] 사람이 [[病院]]으로.\"","[[授業]] 중. [[学生]]들 수군거림. [[町]] 이름. [[宿題]]도 [[勉強]]도 정지.","[[図書館]]. 사서 [[女の人]]. 옛 신문. [[去年]] 기사. [[医者]] 방문 기록.","\"[[試験]] 끝나고?\" [[明日]] 연기 검토. [[昨日]]처럼은 안 하기로. [[今年]] 처음."]},{"title":"3화 · 골목","body":["[[道]]. [[橋]]. [[隣]] [[町]]. 낯선 [[建物]].","[[公園]] 앞 [[店]]. 주인: \"그 집 아들, [[大学]] 졸업, [[会社]] 근무, [[仕事]] 중단.\"","[[駅]] 쪽. [[銀行]]과 [[郵便局]] 사잇길. 창백한 [[男の人]].","\"[[皆さん]] 오해예요. [[外国人]] 노동자 숙소. [[来年]] 철거.\"","그의 [[お父さん]]: 그 [[工場]] 관리인. [[会社]] 아님. 확인된 건 그것뿐."]},{"title":"4화 · 다시 조용한 밤","body":["[[庭]] 딸린 작은 [[家]]. [[玄関]]. 신발 다수.","[[台所]]. [[お母さん]]으로 보이는 사람이 문을 열었다.","\"[[毎朝]] 우리 [[子供]]이 배관을 두드려요. [[医者]] 권고. 재활.\"","그게 전부. [[今週]] 내내의 공포는 무효. 한 [[週間]] 낭비.","이 [[国]] 어디에나 있을 이유.","[[来月]] 재활 종료. [[今月]] 안에 인사. [[来週]] 저녁 약속.","[[昼]]. [[夜]]. [[昼]]. [[夜]]. 소리는 잦아들었다."]}]}}},{"key":"thu","label":"목요일","days":[4],"modes":{"basic":{"title":"30년 늦게 온 편지","episodes":[{"title":"1화 · 30년 늦게 온 편지","body":["[[今日]] [[朝]], 우리 집 [[玄関]] 우편함에 낯선 편지 한 통이 꽂혀 있었다. 봉투는 누렇게 바랬고, 소인 날짜는 [[去年]]도 [[先月]]도 아닌 30년 전이었다.","[[父]]는 [[会社]]에 갈 준비를 하다 말고 봉투를 뒤집어 보았다. 받는 사람 자리에는 이름 대신 이렇게 적혀 있었다. '이 [[家]]에 사는 [[学生]]에게.'","[[今]] 이 집에 사는 학생은 나 하나뿐이었다. [[兄]]은 [[大学]] 기숙사에 있고, [[姉]]는 [[仕事]] 때문에 다른 [[町]]에 산다.","[[母]]가 [[台所]]에서 손을 닦으며 나왔다. 봉투를 본 순간 어머니의 표정이 아주 짧게 굳었다. [[半]]초쯤 되는 시간이었지만 나는 분명히 봤다.","[[弟]]와 [[妹]]는 신기하다며 봉투를 만지작거렸다. [[子供]]들에게는 그냥 오래된 종이 한 장이었다.","봉투 안에는 딱 한 문장이 적혀 있었다. '[[明日]] [[昼]], 도서관 3층으로 와.' [[昨日]]까지 세상에서 가장 평범했던 우리 [[家族]]의 [[時間]]이 그 한 줄에서 멈췄다."]},{"title":"2화 · 도서관 3층의 상자","body":["[[学校]] [[授業]]가 끝나자마자 [[図書館]]으로 달려갔다. [[試験]] 기간이 아니어서 3층은 텅 비어 있었다.","[[友達]] 한 명이 따라왔다. \"[[宿題]]는 나중에 해도 돼. 이런 건 같이 봐야지.\"","구석 책장 앞에 [[先生]]님 한 분이 서 있었다. 우리 [[教室]] 담임이 아니라 처음 보는 나이 많은 분이었다.","\"[[毎日]] 여기서 기다렸어요. 정확히는 [[毎朝]], [[先週]]부터요.\" 선생님이 말했다. \"편지가 언제 도착할지 몰라서.\"","선생님은 낡은 상자를 꺼냈다. 뚜껑에는 '[[来年]]에 열 것'이라고 적혀 있었는데, 그 '내년'은 30년 전의 내년이었다.","상자 안에는 편지가 스무 통 넘게 들어 있었다. 전부 [[勉強]]하다 만 공책 종이에 쓴 것이었고, 봉투마다 다른 주소가 적혀 있었다."]},{"title":"3화 · 스무 개의 주소","body":["\"[[今週]] 안에 다 배달해야 해요.\" 선생님이 말했다. 우리는 지도를 펴고 동네를 나눠 걸었다.","[[道]]를 따라 내려가 [[公園]] 옆 작은 [[店]]에 첫 번째 편지를 건넸다. 주인 [[女の人]]은 봉투를 보자마자 울었다.","[[銀行]] 경비원, [[郵便局]] 창구 직원, [[駅]] 앞에서 신문을 파는 [[男の人]]까지 다들 그 손글씨를 알아봤다.","\"[[外国人]] 노동자들이 살던 [[工場]] 기숙사 알아요?\" 우체국 직원이 물었다. \"거기 [[建物]]은 [[今月]] 초에 헐렸어요.\"","마지막 편지의 주소는 [[橋]] 건너, [[国]] 지도에도 나오지 않을 만큼 작은 골목이었다.","[[夜]]가 되어 [[隣]] 동네까지 걸었을 때, 우리는 남은 시간을 [[分]] 단위로 세고 있었다."]},{"title":"4화 · 골목 끝의 사람","body":["골목 끝에는 작은 [[病院]]이 있었다. [[医者]] 한 분이 우리를 기다렸다는 듯 문 앞에 서 있었다.","\"[[毎晩]] 이 시간에 산책을 해요.\" 의사가 말했다. \"그 편지, 나한테 온 거죠?\"","그는 [[部屋]] 안쪽, 작은 [[庭]]이 보이는 자리에 우리를 앉혔다. 그리고 30년 전 이야기를 시작했다.","\"[[今年]] 봄에 이 병원을 그만둘 생각이었어요. 그런데 하필 [[今日]] 이 편지가 왔네요.\"","편지를 쓴 사람은 그때 그 학교의 학생이었던 우리 [[お父さん]]이었다.","\"[[皆さん]] 앞에서 약속했었죠. 30년 뒤에 다시 만나자고. 다들 잊었을 줄 알았는데.\" 의사가 웃었다."]},{"title":"5화 · 답장","body":["[[父]]는 그날 밤 늦게까지 아무 말도 하지 않았다. 그러다 조용히 말했다. \"그 상자, 진작에 잊었다고 생각했는데.\"","편지를 쓴 날은 아버지의 열여섯 번째 [[誕生日]]이었다고 했다. 그날 반 친구들과 30년 뒤를 약속했던 것이다.","[[お母さん]]은 아버지의 손글씨를 처음 본다며 웃었다. \"이렇게 글씨를 못 쓰는 사람인 줄은 몰랐네.\"","[[来週]]에는 그 도서관 3층에서 작은 모임이 열린다. 30년 전 그 교실에 있던 사람들이 하나둘 답장을 보내오고 있다.","[[来月]]에는 형과 누나도 내려오기로 했다. [[週間]] 단위로 계획을 세우는 가족이 된 건 정말 오랜만이다.","나도 편지를 한 통 썼다. 받는 사람은 30년 뒤 이 집에 살 학생. 언젠가 누군가 아침에 우편함을 열고, 오늘의 나를 궁금해할 것이다."]}]},"hard":{"title":"소인 30년","episodes":[{"title":"1화 · 소인 30년 (하드모드)","body":["[[今日]] [[朝]]. [[玄関]] 우편함. 누런 봉투.","소인: [[今年]] 아님. [[去年]] 아님. [[先月]] 아님. 30년 전.","수신: '이 [[家]]의 [[学生]].'","[[今]] 이 [[家]]의 [[学生]]은 나뿐. [[兄]]: [[大学]] 기숙사. [[姉]]: 다른 [[町]], [[会社]] [[仕事]] 중.","[[父]]: [[会社]] 출근 준비 중단. [[母]]: [[台所]]에서 나옴. [[半]]초 경직.","[[弟]] [[妹]]: 봉투 촉감. [[子供]]에겐 종이.","내용 한 줄: '[[明日]] [[昼]], [[図書館]] 3층.' [[昨日]]까지 평범하던 [[家族]]. [[時間]] 정지."]},{"title":"2화 · 3층의 상자","body":["[[学校]] [[授業]] 종료. [[図書館]]. [[試験]] 기간 아님. 3층 무인.","[[友達]] 한 명 동행. \"[[宿題]]는 나중.\"","낯선 [[先生]]. 우리 [[教室]] 담임 아님. [[学校]] 소속도 아님.","\"[[毎日]] 기다렸어요. 정확히는 [[毎朝]]. [[先週]]부터. [[毎晩]]도.\"","상자. 뚜껑: '[[来年]]에 열 것.' 30년 전의 [[来年]].","편지 스무 통. [[勉強]] 공책 종이. [[町]] 주소 전부 상이."]},{"title":"3화 · 스무 개의 주소","body":["\"[[今週]] 안에 배달 완료. [[来週]] 불가.\"","[[道]]. [[公園]]. [[店]]. [[駅]]. 1번. 주인 [[女の人]]. 울음.","[[銀行]] 경비. [[郵便局]] 창구. [[駅]] 앞 [[男の人]]. 전원 필체 인지.","\"[[外国人]] 노동자 [[工場]] 기숙사요? 그 [[建物]] [[今月]] 초 철거.\"","마지막 주소: [[橋]] 건너. [[隣]] [[町]]. [[国]] 지도 미등재 골목.","[[夜]]. [[隣]] [[町]]까지 도보. 잔여 [[時間]]을 [[分]] 단위로. [[毎晩]] 이 시각 폐문. [[毎日]] 동일."]},{"title":"4화 · 답장","body":["골목 끝. 작은 [[病院]]. [[庭]]. [[玄関]]. [[医者]]가 문 앞.","\"그 편지, 나한테 온 거죠.\" [[医者]]의 첫 마디.","[[部屋]] 안쪽. [[庭]] 보이는 자리. 30년 전 이야기.","\"[[今年]] 봄 은퇴 예정이었어요. [[来月]] 폐업.\"","발신인: 그때 그 [[学校]] [[学生]]. 우리 [[お父さん]].","\"[[皆さん]] 앞에서 약속했죠. 30년 뒤.\"","[[父]]의 열여섯 번째 [[誕生日]]. 그날의 편지.","[[お母さん]] 웃음: \"글씨가 이 정도일 줄은.\"","[[来週]] [[図書館]] 3층 모임. [[来月]] [[兄]]과 [[姉]] 합류. [[週間]] 단위 계획을 세우는 [[家族]].","나도 한 통. 수신: 30년 뒤 이 [[家]]의 [[学生]]. 발신: [[今日]]의 [[学生]]."]}]}}},{"key":"fri","label":"금요일","days":[5],"modes":{"basic":{"title":"칠판의 숫자","episodes":[{"title":"1화 · 칠판의 숫자","body":["[[今日]] [[朝]], [[教室]] 칠판 구석에 낯선 숫자가 하나 적혀 있었다. 크고 삐뚤빼뚤한 '7'.","[[先生]]님은 그것을 지우고 [[授業]]를 시작했지만, 아무도 [[勉強]]에 집중하지 못했다.","[[昨日]] [[夜]] [[学校]] 문은 분명히 잠겨 있었다. [[学生]] 중 누구도 들어올 수 없었다는 뜻이다.","[[友達]]가 속삭였다. \"[[先週]]에는 [[隣]] 반 칠판에 8이 적혀 있었대.\"","[[宿題]]를 하는 척하며 나는 공책에 숫자를 적었다. 8, 7. 하루에 하나씩 줄고 있었다.","[[今]]부터 세면 한 [[週間]]도 남지 않았다. 다만 무엇까지 남은 건지는 아무도 몰랐다."]},{"title":"2화 · 마을 전체의 7","body":["[[昼]] [[時間]]에 친구와 [[町]]을 한 바퀴 돌았다. 숫자는 학교에만 있는 게 아니었다.","[[公園]] 벤치 등받이, [[駅]] 앞 기둥, [[銀行]] 유리문 아래쪽, [[郵便局]] 우편함 옆. 전부 같은 손글씨의 '7'이었다.","[[店]] 주인 [[男の人]]은 어깨를 으쓱했다. \"[[毎朝]] 지워도 [[毎晩]] 다시 생기더라고.\"","[[道]] 끝, 오래된 [[橋]] 앞에는 공사 가림막이 서 있었다. 그 한가운데에도 '7'이 있었다.","[[病院]] 담벼락, [[工場]] 정문, 심지어 낡은 [[建物]] 옥상 물탱크에도. 이 [[国]] 어디에도 이런 동네는 없을 거라고 친구가 말했다.","[[図書館]] 앞에서 [[女の人]] 한 분이 우리를 보고 웃었다. \"[[皆さん]], 그거 무서운 거 아니에요.\" 하지만 그 이상은 말해주지 않았다."]},{"title":"3화 · 5, 4, 3","body":["[[家]]에 돌아오니 [[家族]]이 이미 그 이야기를 하고 있었다.","[[父]]는 [[会社]] 동료들도 안다고 했고, [[母]]는 [[台所]] 창문 너머 [[庭]] 담장에도 숫자가 있다고 했다.","[[兄]]은 장난이라고 했고, [[姉]]는 [[試験]] 기간에 신경 쓰지 말라고 했다. [[先月]]에도 이상한 소문이 돌았다며.","[[妹]]는 무섭다고 [[部屋]] 불을 켠 채 잤고, [[弟]]는 [[玄関]] 앞에 분필 한 통을 놓아두었다. \"범인이 쓰다가 잊고 갈 수도 있잖아.\"","[[毎日]] 숫자는 어김없이 하나씩 줄었다. 5, 4, 3.","[[医者]]인 이모는 병원 로비에서도 그 숫자를 봤다고 했다. \"[[今週]] 안에 뭔가 일어나긴 하나 보다.\""]},{"title":"4화 · 새벽 세 시의 사람","body":["'2'가 적힌 날, 나는 [[半]]쯤 자다 깨서 창밖을 봤다. 시계는 새벽 세 시 십 [[分]]이었다.","가로등 아래에서 누군가 길바닥에 쪼그려 앉아 분필로 무언가를 쓰고 있었다.","나는 조용히 집을 나와 다가갔다. 노인이었다. 손이 심하게 떨리고 있었다.","\"놀랐지?\" 노인이 먼저 말했다. \"[[大学]]도 못 나온 늙은이가 [[子供]]들 겁만 준 셈이네.\"","그는 [[去年]]까지 저 공장에서 일했고, 젊을 때는 저 다리를 놓는 [[仕事]]에 참여했다고 했다.","\"다리가 [[今月]] 말에 다시 열려. [[外国人]] 기술자들이랑 같이 만든 다리야. 그날까지 며칠 남았는지, 나 혼자 세기엔 너무 길어서 그랬어.\""]},{"title":"5화 · 0","body":["'0'이 적힌 날 아침, 동네 사람들이 다리 앞에 모였다.","[[お父さん]]과 [[お母さん]]도 나왔고, 학교 선생님들도 학생들을 데리고 나왔다.","노인은 [[誕生日]]도 아닌 날에 꽃다발을 받고 어쩔 줄 몰라 했다.","\"[[明日]]부터는 이 다리로 역까지 십 분이면 가요.\" 누군가 말하자 사람들이 웃었다.","[[来週]]에는 다리 위에서 작은 장이 열린다고 했다. [[来月]]에는 옆 마을까지 이어지는 길도 넓어진다.","[[来年]]에는 손자와 함께 이 다리를 건너고 싶다고 노인이 말했다. [[今年]] 내내 숫자를 세어온 이유였다.","그날 밤, 나는 방 창문으로 다리의 불빛을 오래 봤다. 어떤 숫자는 경고가 아니라 기다림이었다."]}]},"hard":{"title":"8, 7","episodes":[{"title":"1화 · 8, 7 (하드모드)","body":["[[今日]] [[朝]]. [[教室]] 칠판 구석. '7'.","[[先生]]이 지움. [[授業]] 시작. [[勉強]] 불가.","[[昨日]] [[夜]] [[学校]] 폐문. [[学生]] 출입 불가.","[[友達]]: \"[[先週]]엔 [[隣]] 반에 8.\"","[[宿題]] 공책 기록. 8. 7. [[毎日]] 하나씩.","[[今]]부터 한 [[週間]] 미만. [[来週]]는 없다. 무엇까지인지 불명."]},{"title":"2화 · 마을 전체의 7","body":["[[昼]]. [[時間]]을 내서 [[町]] 일주.","[[公園]] 벤치. [[駅]] 기둥. [[銀行]] 유리문. [[郵便局]] 우편함. 전부 '7'.","[[店]] 주인 [[男の人]]: \"[[毎朝]] 지워도 [[毎晩]] 재생.\"","[[道]] 끝. 오래된 [[橋]]. 가림막 중앙에도 7.","[[病院]] 담. [[工場]] 정문. [[学校]] 후문. 낡은 [[建物]] 물탱크.","[[図書館]] 앞. [[女の人]] 웃음. \"[[皆さん]], 무서운 거 아니에요.\" 그뿐.","이 [[国]]에 이런 [[町]]은 없다."]},{"title":"3화 · 5, 4, 3","body":["[[家]]. [[家族]] 이미 논의 중. [[父]] [[母]] [[兄]] [[姉]] 전원.","[[父]]: [[会社]] 동료도 목격. [[母]]: [[台所]] 창 너머 [[庭]] 담장.","[[兄]]: 장난. [[姉]]: [[試験]] 기간, 무시. \"[[先月]]에도 소문.\"","[[妹]]: [[部屋]] 불 켜고 취침. [[弟]]: [[玄関]] 앞에 분필 배치.","[[毎日]] 감소. [[毎朝]] 확인. 5. 4. 3.","[[医者]]인 이모: [[病院]] 로비에서도 목격. \"[[今週]] 안에 뭔가 있겠네.\""]},{"title":"4화 · 0","body":["'2'. [[夜]]. [[半]]쯤 자다 깼다. 세 시 십 [[分]].","[[道]]. 가로등. 쪼그린 사람. 분필.","노인. 떨리는 손. \"[[大学]]도 못 나온 늙은이가 [[子供]]들 겁만 줬네.\"","[[去年]]까지 저 [[工場]] 근무. [[会社]] 아님. 젊을 때 저 [[橋]] 놓는 [[仕事]].","\"[[今月]] 말 개통. [[外国人]] 기술자들과 만든 [[橋]]. 남은 날을 혼자 세기엔 길었어.\"","'0'. [[橋]] 앞에 [[町]] 전체. [[家族]] 전원. [[お父さん]]도 [[お母さん]]도.","노인은 [[誕生日]]도 아닌 날에 꽃. [[子供]]들이 건넸다.","\"[[明日]]부터 십 [[分]]이면 [[駅]].\"","[[来週]] [[橋]] 위 장. [[来月]] [[道]] 확장. [[来年]]엔 손자와 횡단.","[[今年]] 내내 숫자를 센 이유. 어떤 숫자는 경고가 아니라 기다림."]}]}}},{"key":"sat","label":"토요일","days":[6],"modes":{"basic":{"title":"이름이 같은 두 사람","episodes":[{"title":"1화 · 내가 하지 않은 일들","body":["[[今日]] [[昼]], [[病院]]에서 문자가 왔다. '내일 오전 진료 예약을 확인합니다.' 나는 [[今年]] 들어 병원에 간 적이 한 번도 없었다.","[[昨日]]에는 [[図書館]]에서 연체 안내가 왔다. 빌린 적도 없는 책 세 권.","[[先週]]에는 [[銀行]]에서 통장을 찾아가라는 우편물이, [[先月]]에는 [[郵便局]]에서 소포 안내서가 왔다.","[[母]]는 [[台所]] 식탁에 그 종이들을 쭉 늘어놓고 말했다. \"이름도 생년월일도 전부 너야.\"","[[父]]는 [[会社]] 일로 늦게 들어와 대충 넘겼다. \"[[明日]] [[時間]] 될 때 가서 물어봐.\"","[[妹]]가 킥킥 웃었다. \"오빠 몰래 다른 [[家族]] 있는 거 아니야?\" 웃을 일이 아니었다. [[今]] 나는 조금 무서웠다."]},{"title":"2화 · 출석부에 두 번","body":["[[学校]] [[教室]]에 들어서자 [[友達]]가 이상한 표정으로 물었다. \"너 어제 [[駅]] 앞에 있었지? 인사했는데 그냥 가더라.\"","그 시각 나는 [[部屋]]에서 [[宿題]]만 하고 있었다. [[夜]] 내내 집 밖으로 나가지 않았다.","[[授業]] 중에 [[先生]]님이 출석부를 보다가 멈췄다. \"어? 네 이름이 두 번 적혀 있네.\"","[[試験]] 성적표에도 내 점수가 두 개였다. 하나는 내 것, 하나는 훨씬 좋은 것.","\"[[勉強]] 잘하는 쪽이 진짜 너였으면 좋겠는데.\" 친구가 놀렸다.","[[毎日]] 조금씩 이상한 일이 늘었다. [[毎朝]] 등교할 때마다 모르는 사람이 내게 손을 흔들었다."]},{"title":"3화 · 종이 뭉치를 들고","body":["[[今週]] 토요일, 나는 그 종이들을 전부 챙겨 [[町]]을 한 바퀴 돌기로 했다.","[[銀行]] 창구의 [[女の人]]은 화면을 보고 고개를 갸웃했다. \"주소가 [[隣]] 동네로 되어 있네요.\"","[[郵便局]] 직원은 소포를 어떤 [[男の人]] [[学生]]이 찾아갔다고 했다. \"교복이 우리 동네 것이 아니었어요.\"","병원에서는 [[医者]] 선생님이 웃었다. \"아, 그 학생. [[毎晩]] 늦게까지 [[仕事]]하는 아버지 대신 온다고 했는데.\"","[[公園]] 앞 [[店]] 주인이 결정적인 말을 했다. \"[[橋]] 건너 학교 다니는 애야. 이름도 너랑 똑같더라.\"","[[道]] 끝, [[建物]] 사이로 그 다리가 보였다. 나는 [[分]] 단위로 시간을 재며 뛰었다."]},{"title":"4화 · 다리 건너의 나","body":["다리를 건너자 처음 보는 동네가 나왔다. [[工場]] 담을 따라 걸으니 낡은 [[学校]]가 나왔다.","운동장 구석에 한 남학생이 혼자 앉아 있었다. 뒷모습만 봐도 알 수 있었다.","\"올 줄 알았어.\" 그가 돌아보며 말했다. 얼굴은 나와 전혀 닮지 않았다. 그런데 목소리는 이상하게 비슷했다.","이름이 같고 [[誕生日]]까지 같은 날이었다. [[去年]] 전학 오면서 서류가 통째로 섞였다고 했다.","\"[[大学]] 원서까지 섞이면 큰일 나겠지.\" 그가 웃었다. \"그래서 [[今月]] 내내 은행이랑 우체국을 뛰어다녔어.\"","그의 [[家]]는 [[玄関]] 앞 [[庭]]에 화분이 잔뜩 놓인 집이었다. [[子供]] 때 사진 속 그의 [[お父さん]]을 보고 나는 숨을 삼켰다.","우리 아버지와 똑같은 작업복을 입고, 나란히 어깨동무를 하고 있었다."]},{"title":"5화 · 이름이 같은 두 사람","body":["집에 돌아와 아버지에게 사진 이야기를 했다. 아버지는 한참 말이 없다가 웃었다.","\"[[外国人]] 기술자들이랑 같이 일하던 시절 친구야. 서로 아이 이름을 같은 이름으로 짓자고 약속했었지.\"","[[お母さん]]은 어이없어했다. \"그런 약속을 [[半]] 농담으로 진짜 지키는 사람이 어디 있어요.\"","[[来週]]에는 두 집이 같이 밥을 먹기로 했다. [[兄]]과 [[姉]]도, [[弟]]와 동생도 다 오기로 했다.","[[来月]]부터는 서류가 정리된다고 학교에서 연락이 왔다. [[来年]] 진학 서류는 걱정하지 않아도 된다.","\"[[皆さん]], 이 [[国]]에 이름이 같은 사람이 이렇게 가까이 살 확률이 얼마일까요?\" 선생님이 교실에서 그렇게 소개하자 다들 웃었다.","그날 [[朝]] 우편함에는 아무것도 없었다. 대신 한 [[週間]]에 한 번, 다리 위에서 만나기로 한 약속이 생겼다."]}]},"hard":{"title":"내가 하지 않은 일","episodes":[{"title":"1화 · 내가 하지 않은 일 (하드모드)","body":["[[今日]] [[昼]]. [[病院]] 문자. [[明日]] 예약 확인. [[今年]] 방문 이력 0.","[[昨日]]. [[図書館]] 연체 통지. 대출 이력 0.","[[先週]]. [[銀行]] 통장 안내. [[先月]]. [[郵便局]] 소포 안내서.","[[母]]가 [[台所]]에 전부 배열. \"이름도 [[誕生日]]도 너야.\"","[[父]]: [[会社]] [[仕事]]로 지연. \"[[明日]] [[時間]] 되면 가봐.\"","[[妹]] 웃음: \"다른 [[家族]] 있는 거 아냐?\" [[今]] 공포."]},{"title":"2화 · 두 번 적힌 이름","body":["[[学校]] [[教室]]. [[友達]]: \"[[昨日]] [[駅]] 앞에 있었지? 인사, 무반응.\"","그 [[時間]] 나는 [[家]] [[部屋]]. [[宿題]] 중. [[夜]] 내내 외출 없음.","[[授業]] 중. [[先生]]이 출석부에서 정지. \"[[学生]] 명단에 네 이름이 두 번.\"","[[試験]] 성적표 두 장. [[学校]] 전산 오류 아님.","\"[[勉強]] 잘하는 쪽이 진짜였으면.\" [[友達]] 농담. [[教室]] 전체 웃음.","[[毎日]] 증가. [[毎朝]] 모르는 손인사. [[毎晩]]도."]},{"title":"3화 · 종이 뭉치","body":["[[今週]] 토요일. 종이 뭉치. [[隣]] [[町]] 일주. [[昼]]부터 [[夜]]까지.","[[銀行]] 창구 [[女の人]]: \"주소가 [[隣]] [[町]]이네요.\"","[[郵便局]] 직원: \"[[男の人]] [[学生]]이 수령. 교복이 이 [[町]] 게 아니에요.\"","[[医者]]: \"[[毎晩]] [[仕事]]하는 [[父]] 대신 온다던 [[学生]]요.\"","[[公園]] 앞 [[店]] 주인: \"[[橋]] 건너 [[学校]] 애. 이름도 동일.\"","[[道]] 끝. [[駅]] 방향. [[橋]]. [[分]] 단위로 계측. 질주."]},{"title":"4화 · 이름이 같은 두 사람","body":["[[橋]] 건너. [[工場]] 담. [[建物]] 사이. 낡은 [[学校]].","운동장 구석. [[男の人]] 하나. 뒷모습으로 확인.","\"올 줄 알았어.\" 얼굴 상이. 목소리 동일. [[学生]]복 상이.","이름 동일. [[誕生日]] 동일. [[去年]] 전학. [[学校]] 서류 혼입.","\"[[大学]] 원서까지 섞이면 큰일. [[先月]]도 [[今月]]도 내내.\"","그의 [[家]]. [[玄関]]. [[庭]]. 화분. [[子供]] 때 사진. 그의 [[お父さん]].","우리 [[父]]와 같은 [[工場]] 작업복. 어깨동무.","\"[[外国人]] 기술자들과 일하던 친구야. [[子供]] 이름을 같게 짓자고 약속.\"","[[お母さん]] 웃음: \"[[半]] 농담을 지키는 사람이 어디 있어요.\"","[[来週]] 두 [[家族]] 회식. [[兄]] [[姉]] [[弟]] [[妹]] 전원 참석.","[[来月]] 서류 정리. [[来年]] 진학. [[大学]] 문제없음.","\"[[皆さん]], 이 [[国]]에 이런 확률이.\" 그날 [[朝]] 우편함 비었음. [[週間]] 1회, [[橋]] 위 약속."]}]}}},{"key":"sun","label":"일요일","days":[0],"modes":{"basic":{"title":"일요일의 다리","episodes":[{"title":"1화 · 현관 밑에서 나온 열쇠","body":["[[今日]]은 [[家]] [[玄関]] 바닥을 고치는 날이었다. [[朝]]부터 온 [[家族]]이 매달렸다.","[[父]]가 낡은 널빤지를 들어내자 먼지 속에서 작은 열쇠 하나가 나왔다.","[[母]]는 [[台所]]에서 손을 닦고 나와 열쇠를 들여다보았다. \"[[去年]] 이사 왔을 땐 없던 건데.\"","열쇠에는 숫자가 새겨져 있었다. [[時間]]이 오래 지나 반쯤 지워진 세 자리 숫자.","[[兄]]은 [[大学]] 과제로 바빴고 [[姉]]는 [[会社]] 야근이라 했다. [[弟]]와 [[妹]]만 신이 나서 열쇠를 뺏어 갔다.","[[昨日]]까지 아무 일 없던 우리 집의 한 [[週間]]이, 그 작은 쇳조각 하나로 이상해지기 시작했다."]},{"title":"2화 · 숫자가 가리키는 곳","body":["[[毎朝]] 그 열쇠 생각을 했다. [[学校]] [[授業]] 중에도, [[勉強]] 중에도.","[[教室]]에서 [[友達]]에게 보여주자 친구는 단번에 알아봤다. \"이거 [[駅]] 물품보관함 열쇠잖아.\"","[[先生]]님도 거들었다. \"[[先週]]에 그 보관함 없앤다는 기사를 봤는데. [[今月]] 말까지라던데.\"","[[図書館]]에서 옛날 [[町]] 사진을 찾아봤다. [[試験]]도 [[宿題]]도 눈에 들어오지 않았다.","사진 속 역은 지금과 전혀 달랐다. 그 옆에는 지금은 없는 커다란 [[建物]]이 서 있었다.","[[今]] 이 열쇠는 몇 년째 그 안에서 무언가를 지키고 있었던 걸까. [[今週]] 안에 열어보지 않으면 영영 못 열 터였다."]},{"title":"3화 · 한 번도 열린 적 없는 칸","body":["[[昼]] 수업이 끝나고 [[道]]를 따라 역으로 갔다.","역무원 [[男の人]]이 우리를 이상하게 봤다. \"그 번호 칸은 [[毎日]] 확인하는데, 한 번도 열린 적이 없어요.\"","\"[[分]]만 기다려요. 관리 [[仕事]] 하시는 분 불러올게요.\"","[[半]] 시간쯤 지나 문이 열렸다. 안에는 얇은 종이 뭉치와 낡은 봉투 하나가 들어 있었다.","종이는 손으로 그린 동네 지도였다. [[公園]], [[店]], [[銀行]], [[郵便局]], [[病院]]까지 전부 옛날 이름으로 적혀 있었다.","[[夜]]이 될 때까지 우리는 그 지도를 들여다봤다. 지금 [[工場]]이 서 있는 자리에는 커다란 [[庭]]이 그려져 있었다."]},{"title":"4화 · 다리 위의 세 아이","body":["봉투 안에는 편지가 아니라 사진 한 장이 들어 있었다.","[[子供]] 셋이 [[橋]] 위에 나란히 서 있었다. 가운데 아이의 얼굴이 아버지와 똑같았다.","[[医者]]가 되겠다던 아이, 다른 [[国]]로 가겠다던 아이, 그리고 이 동네에 남겠다던 아이.","사진 뒷면에는 이렇게 적혀 있었다. '우리 셋 중 마지막까지 이 동네에 남는 사람이 이 칸을 연다.'","아버지는 사진을 오래 들여다봤다. \"[[外国人]] 회사로 갔던 친구는 연락이 끊긴 지 한참 됐어.\"","[[隣]] 동네 병원에 그 의사 친구가 아직 있다고 했다. [[女の人]]이 된 그 아이는 지금 그 병원 원장이었다.","[[先月]]부터 아버지 휴대폰에 모르는 번호가 몇 번 찍혔다고 했다. 그때는 그냥 광고인 줄 알았다며 아버지가 웃었다.","그러니까 열쇠를 찾은 건 우연이 아니었다. 아버지는 [[毎晩]] 그 약속을 잊으려 애쓰며 살았을 뿐이다."]},{"title":"5화 · 일요일의 다리","body":["[[来週]] 일요일, 세 사람이 그 다리 위에서 만나기로 했다.","[[お父さん]]은 며칠 내내 거울 앞에서 인사말을 연습했다. [[お母さん]]은 그 모습을 보고 웃었다.","[[誕生日]]도 명절도 아닌 평범한 날이었지만, 우리 집 [[部屋]]마다 아침부터 불이 켜졌다.","외국 회사로 갔던 친구도 [[来月]] 귀국한다고 연락이 왔다. [[明日]] 비행기표를 끊는다고 했다.","\"[[皆さん]], 오래 기다리셨습니다.\" 아버지가 연습했던 그 말을 다리 위에서 진짜로 했다.","[[来年]]에는 그 지도를 학교 도서관에 기증하기로 했다. 지금 [[学生]]들도 옛 동네를 볼 수 있도록.","[[今年]]의 어느 조용한 밤, 나는 열쇠를 책상 서랍 깊숙이 넣었다. 언젠가 누군가 다시 찾아낼 수 있게."]}]},"hard":{"title":"현관 밑 열쇠","episodes":[{"title":"1화 · 현관 밑 열쇠 (하드모드)","body":["[[今日]]. [[家]] [[玄関]] 바닥 공사. [[朝]]부터 [[家族]] 전원.","[[父]]가 널빤지 제거. 먼지. 작은 열쇠. [[今]] 아무도 모름.","[[母]]가 [[台所]]에서 나옴. \"[[去年]] 이사 때는 없던 것.\"","열쇠에 세 자리 숫자. [[時間]]에 [[半]]쯤 마모.","[[兄]]: [[大学]] 과제. [[姉]]: [[会社]] 야근. [[弟]]와 [[妹]]만 흥분.","[[昨日]]까지 멀쩡하던 한 [[週間]]. [[今日]] 붕괴."]},{"title":"2화 · 숫자가 가리키는 칸","body":["[[毎朝]] 열쇠 생각. [[学校]] [[授業]] 중에도. [[勉強]] 중에도. [[毎日]]. [[毎晩]].","[[教室]]. [[友達]] 즉답: \"[[駅]] 물품보관함.\"","[[先生]] 보충: \"[[先週]] 기사. 철거 예정. [[今月]] 말까지.\"","[[図書館]]. 옛 [[町]] 사진. [[試験]]도 [[宿題]]도 무시.","사진 속 [[駅]] 옆. [[今]]은 없는 [[建物]].","[[今]] 이 열쇠는 몇 년을 지켰나. [[今週]] 안에 못 열면 끝."]},{"title":"3화 · 한 번도 열린 적 없는 칸","body":["[[昼]] [[授業]] 종료. [[道]]를 따라 [[駅]]으로.","역무원 [[男の人]]: \"[[毎日]] 확인. 열린 적 없어요.\"","\"[[分]]만요. 관리 [[仕事]] 하는 분 호출.\"","[[半]] [[時間]]. 개방. 종이 뭉치. 낡은 [[郵便局]] 봉투.","손으로 그린 지도. [[公園]]. [[店]]. [[銀行]]. [[病院]]. [[学校]]. [[工場]]. 전부 옛 이름.","[[夜]]까지 검토. [[今]] [[工場]] 자리엔 커다란 [[庭]]."]},{"title":"4화 · 일요일의 다리","body":["봉투 내용물: 편지 아님. 사진. [[昨日]]의 것이 아님.","[[子供]] 셋. [[橋]] 위. 가운데 아이 = [[父]].","[[医者]] 지망. 다른 [[国]] 지망. [[町]] 잔류 지망.","뒷면: '마지막까지 [[町]]에 남는 [[子供]]이 이 칸을 연다.'","\"[[外国人]] [[会社]]로 간 친구는 연락 두절.\"","[[隣]] [[町]] [[病院]] 원장. [[女の人]]이 된 그 [[子供]].","[[先月]]부터 [[父]] 폰에 모르는 번호. 광고로 오인.","우연 아님. [[父]]는 [[毎晩]] 그 약속을 잊으려 했을 뿐. [[毎朝]]도.","[[来週]] 일요일. [[昼]]. [[橋]] 위. 세 사람.","[[お父さん]]은 거울 앞 인사말 연습. [[お母さん]] 웃음. [[家族]] 전원 대기.","[[誕生日]]도 명절도 아닌 날. 우리 [[家]] [[部屋]]마다 점등.","외국 [[会社]]로 간 친구도 [[来月]] 귀국. [[明日]] 발권.","\"[[皆さん]], 오래 기다리셨습니다.\" [[橋]] 위 [[父]]의 인사.","[[来年]] 지도는 [[学校]] [[図書館]]에 기증. [[学生]]들도 옛 [[町]]을 보게.","[[今年]]의 어느 [[夜]], 열쇠를 서랍 깊숙이."]}]}}}]},"n4":{"label":"N4","full":"N4 · 중급","ready":false,"subtitle":"준비 중","lexicon":{},"mnemonics":{},"kanjiHints":{},"todayWords":[],"stories":[]},"n3":{"label":"N3","full":"N3 · 중고급","ready":true,"subtitle":"수신인: 나 · 0번 승강장","lexicon":{"石油":{"kana":"せきゆ","hangul":"세키유","meaning":"석유"},"主要":{"kana":"しゅよう","hangul":"슈요우","meaning":"주요, 주된"},"最初":{"kana":"さいしょ","hangul":"사이쇼","meaning":"처음, 최초"},"配る":{"kana":"くばる","hangul":"쿠바루","meaning":"나누어 주다, 배포하다"},"基本":{"kana":"きほん","hangul":"키혼","meaning":"기본"},"感情的":{"kana":"かんじょうてき","hangul":"칸죠우테키","meaning":"감정적"},"加熱":{"kana":"かねつ","hangul":"카네츠","meaning":"가열"},"家具":{"kana":"かぐ","hangul":"카구","meaning":"가구"},"薬局":{"kana":"やっきょく","hangul":"얏쿄쿠","meaning":"약국"},"泣く":{"kana":"なく","hangul":"나쿠","meaning":"울다"},"身長":{"kana":"しんちょう","hangul":"신초우","meaning":"신장, 키"},"困る":{"kana":"こまる","hangul":"코마루","meaning":"곤란하다, 난처하다"},"完全":{"kana":"かんぜん","hangul":"칸젠","meaning":"완전, 완전한"},"腹痛":{"kana":"ふくつう","hangul":"후쿠츠우","meaning":"복통"},"他人":{"kana":"たにん","hangul":"타닌","meaning":"타인, 다른 사람"},"終点":{"kana":"しゅうてん","hangul":"슈우텐","meaning":"종점"},"呼吸":{"kana":"こきゅう","hangul":"코큐우","meaning":"호흡"},"帯":{"kana":"おび","hangul":"오비","meaning":"띠, 벨트, 띠 모양의 것"},"郵便":{"kana":"ゆうびん","hangul":"유우빈","meaning":"우편"},"涙":{"kana":"なみだ","hangul":"나미다","meaning":"눈물"},"西洋":{"kana":"せいよう","hangul":"세이요우","meaning":"서양"},"地面":{"kana":"じめん","hangul":"지멘","meaning":"
