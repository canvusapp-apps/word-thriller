에 존재하고 있다 → 있다."},"郵":{"parts":"垂(드리우다) + 阝(마을·장소처럼 보기)","memory":"멀리 늘어진 소식을 마을로 전달한다 → 우편."},"送":{"parts":"辶(길) + 큰 짐을 들고 가는 모습","memory":"길을 따라 짐을 들고 보낸다 → 보내다."},"情":{"parts":"忄(마음) + 青(푸르다)","memory":"마음속 상태가 맑게 드러난다 → 감정, 사정."},"報":{"parts":"소식을 손에서 손으로 넘기는 복잡한 모양","memory":"생긴 일을 다른 사람에게 넘겨 알린다 → 알리다, 보고."},"便":{"parts":"亻(사람) + 更(바꾸다·더하다처럼 보기)","memory":"사람이 더 편하게 움직일 수 있게 한다 → 편리, 소식."},"裏":{"parts":"衣(옷) 속에 里(마을)가 들어간 모양","memory":"겉옷을 뒤집으면 안쪽에 숨은 면이 나온다 → 뒤, 안쪽."},"秒":{"parts":"禾(벼) + 少(적다)","memory":"벼 이삭이 아주 조금 흔들릴 만큼 짧은 시간 → 초."},"動":{"parts":"重(무겁다) + 力(힘)","memory":"무거운 것을 힘으로 밀어 움직인다 → 움직이다."},"作":{"parts":"亻(사람) + 乍(무언가를 하는 모양으로 보기)","memory":"사람이 손을 움직여 무언가를 한다 → 만들다, 행동하다."},"疑":{"parts":"여러 방향의 발과 길이 얽힌 모양으로 보기","memory":"어디로 가야 할지 발이 꼬여 망설인다 → 의심하다."},"最":{"parts":"曰(말·해처럼 보기) + 取(취하다)","memory":"여럿 중 가장 먼저 집어 든 것 → 가장, 최초의 '최'."},"初":{"parts":"衤(옷) + 刀(칼)","memory":"옷감을 만들려고 처음 칼을 대는 순간 → 처음."},"細":{"parts":"糸(실) + 田(밭)","memory":"밭의 칸을 실처럼 가늘게 나눈다 → 가늘다."},"深":{"parts":"氵(물) + 안쪽으로 파고드는 모양","memory":"물속으로 아무리 손을 넣어도 바닥이 멀다 → 깊다."},"生":{"parts":"땅을 뚫고 새싹이 올라오는 모양","memory":"새싹이 땅에서 솟아난다 → 나다, 생기다."},"逃":{"parts":"辶(길) + 兆(징조)","memory":"위험한 징조를 보고 길로 달아난다 → 도망치다."},"呼":{"parts":"口(입) + 乎(후- 소리를 떠올리기)","memory":"입으로 후 하고 숨을 내보낸다 → 부르다, 내쉬다."},"吸":{"parts":"口(입) + 及(끌어당기다처럼 보기)","memory":"입으로 공기를 끌어당긴다 → 들이마시다."},"苦":{"parts":"艹(풀) + 古(오래되다)","memory":"오래된 쓴 풀을 씹어 얼굴을 찡그린다 → 괴롭다."},"複":{"parts":"衤(옷) + 겹쳐 돌아오는 모양","memory":"옷을 여러 겹 포개 입는다 → 겹치다, 복수의."},"数":{"parts":"米(쌀알) + 하나씩 세는 손동작처럼 보기","memory":"쌀알을 하나씩 놓고 센다 → 수, 숫자."},"比":{"parts":"두 사람이 나란히 선 모양","memory":"둘을 옆에 세워 차이를 본다 → 비교하다."},"完":{"parts":"宀(지붕) + 元(바탕)","memory":"집 안의 바탕까지 모두 갖춰졌다 → 완전, 완성."},"全":{"parts":"모든 것이 한곳으로 모여 온전한 모양","memory":"빠진 것 없이 전부 모인다 → 전부, 온전하다."},"努":{"parts":"奴 + 力(힘)","memory":"힘(力)을 한 번 더 짜내 애쓴다 → 노력하다."},"力":{"parts":"굽힌 팔에 힘이 들어간 모양","memory":"팔에 힘을 꽉 주는 모습 → 힘."},"過":{"parts":"辶(길) + 지나가는 덩어리처럼 보기","memory":"길 위를 지나 이미 멀어졌다 → 지나다, 과거의 과."},"去":{"parts":"아래에서 발걸음을 떼고 떠나는 모양","memory":"자리에서 떠나 가버린다 → 가다, 떠나다."},"基":{"parts":"其 + 土(땅)","memory":"땅 위에 단단한 받침을 세운다 → 기초, 기반."},"本":{"parts":"木(나무) + 뿌리 쪽의 짧은 표시","memory":"나무의 뿌리에 표시한다 → 근본, 기본."},"断":{"parts":"斤(도끼)로 무언가를 끊는 장면","memory":"도끼로 연결된 줄을 탁 끊는다 → 끊다, 거절하다."},"朝":{"parts":"해가 뜨는데 月(달)이 아직 남은 장면","memory":"달이 남아 있는 사이 해가 올라온다 → 아침."},"刊":{"parts":"干 + 刂(칼)","memory":"판을 칼로 새겨 여러 장 찍어 낸다 → 간행하다."},"残":{"parts":"歹(부서짐) + 작은 조각이 겹친 모양","memory":"다 부서진 뒤에도 조각 하나가 남는다 → 남다."}},"todayWords":["郵送","秒","生える","逃げる","努力","動作","通知"],"stories":[{"key":"s1","label":"전체","days":null,"modes":{"basic":{"title":"수신인: 나 · 0번 승강장","episodes":[{"title":"1부 · 내가 보낸 택배","body":["철거를 한 달 앞둔 오래된 아파트에서 짐을 정리하던 밤이었다. 건물 대부분은 [[留守]] 상태였고, 내가 사는 503호만 불이 켜져 있었다.","새벽 1시 13분, 휴대전화에 택배 도착 [[通知]]가 떴다. 이상한 건 [[現在]] 배송 장소가 바로 이 건물 1층 보관함으로 표시되어 있는데, 발신인도 수신인도 모두 내 이름이었다는 점이었다.","배송 기록을 열어 보니 물건은 오늘이 아니라 '내일 새벽 2시 14분'에 [[郵送]]된 것으로 적혀 있었다. 장난이라고 생각했지만, 배송 회사의 실제 [[情報]] 페이지에서도 같은 기록이 보였다.","1층 보관함에는 작은 상자 하나가 있었다. [[郵便]] 라벨의 [[裏]]에는 내 글씨와 똑같은 필체로 '영상은 13[[秒]]까지만 봐. 그 뒤에는 절대 뒤를 보지 마.'라고 적혀 있었다.","상자 안에는 손바닥만 한 오래된 영상 기기가 들어 있었다. 전원 버튼을 누르지 않았는데도 기계가 혼자 [[動作]]하기 시작했다.","영상에는 이 건물의 복도가 찍혀 있었다. 화면 끝에서 나와 똑같이 생긴 남자가 달려오더니 카메라를 붙잡았다. 그는 숨을 몰아쉬며 말했다. '처음엔 나도 누군가의 장난이라고 [[疑う]]했어. 그런데 2시 14분에 엘리베이터가 열리면 절대로—'","정확히 13[[秒]]. 화면이 검게 꺼졌다. 나는 다시 재생하려 했지만 기계는 더 이상 움직이지 않았다.","그 순간 두 번째 [[通知]]가 떴다. '재배송까지 61분. 수령 장소: 6층 604호.' 이 건물은 [[最初]]부터 5층짜리였다. 그리고 내 현관 밖에서, 멈춰 있던 엘리베이터가 천천히 올라가기 시작했다."]},{"title":"2부 · 13초짜리 6층","body":["새벽 2시 14분이 되자 엘리베이터 버튼 위의 빈 공간에 희미한 숫자 6이 켜졌다. 문이 열리자 안쪽에는 사람 한 명이 겨우 지나갈 만큼 [[細い]] 복도가 이어져 있었다.","복도 끝은 빛이 닿지 않을 정도로 [[深い]] 어둠에 잠겨 있었다. 문 위의 전광판에는 13이라는 숫자가 나타났고, 한 [[秒]]마다 하나씩 줄어들기 시작했다.","11[[秒]]가 남았을 때, 타일 틈에서 검은 머리카락 같은 것이 [[生える]] 모습이 보였다. 그것들은 바닥을 기어 내 발목 쪽으로 자라왔다.","어둠 속에서 내 목소리가 들렸다. '[[逃げる]]. 지금 바로.' 나는 반사적으로 뒤를 볼 뻔했지만, 상자의 경고가 떠올라 앞만 보고 달렸다.","복도 중간의 감시 카메라가 갑자기 [[動作]]했고 붉은 불빛이 켜졌다. 긴장 때문인지 [[呼吸]]이 가빠졌고, 몇 걸음 뛰지 않았는데도 숨쉬기가 [[苦しい]] 정도였다.","604호 앞에는 내 이름이 적힌 상자가 [[複数]] 쌓여 있었다. 날짜를 [[比べる]] 보니 오늘, 내일, 모레, 일주일 뒤까지 하나씩 이어져 있었다. 모든 상자의 발신인은 나였다.","문 옆 모니터에는 복도에 서 있는 내 모습이 비쳤다. 그런데 화면 속 나의 [[動作]]가 정확히 1[[秒]] 늦었다. 내가 손을 내리자 화면 속 나는 잠시 후 손을 내렸다.","나는 그제야 그것이 단순한 지연 영상이라고 생각했다. 그런데 다음 순간, 화면 속 내가 먼저 고개를 돌렸다. 나는 아직 움직이지 않았는데도 말이다.","휴대전화에 세 번째 [[通知]]가 떴다. '수령자 복제 92%. 시선을 돌려 확인하면 [[完全]] 완료.' 동시에 등 뒤에서 내 목소리가 아주 가까이 들렸다. '한 번만 돌아봐.'","엘리베이터 문이 닫히기 시작했다. 나는 바닥에서 자라난 검은 것들을 발로 떼어 내며 문까지 달렸다. 마지막 2[[秒]] 동안 온 힘을 쏟는 [[努力]] 끝에 몸을 문 사이로 밀어 넣었다.","문이 닫히기 직전, 604호 모니터 속의 내가 웃었다. 그리고 입 모양만으로 말했다. '다음 상자는 네가 [[郵送]]해.'"]},{"title":"3부 · 발신인 없음","body":["503호로 돌아온 뒤 나는 상자와 영상 기기를 처음부터 다시 살폈다. 케이스의 [[裏]]를 뜯어내자 아주 작은 반송 라벨과 오래된 배송 기록이 나왔다.","기록의 [[過去]] 항목에는 8년 동안 같은 시간, 같은 주소로 물건이 반복해서 보내졌다고 적혀 있었다. 그리고 맨 아래에 배송 시스템의 [[基本]] 규칙처럼 짧은 문장이 있었다. '수령자가 뒤를 보면 복제가 완료된다. 복제체는 다음 수령자에게 상자를 보낸다.'","그제야 영상 속 남자가 미래의 내가 아니라는 걸 알았다. 그는 이전 수령자를 흉내 낸 무언가였고, 나에게 상자를 [[郵送]]해 스스로 6층으로 오게 만든 것이었다.","새로운 [[通知]]가 떴다. '미수령 물품 1건. 재배송을 시작합니다.' 화면 아래에는 작게 '수령 [[断る]]' 버튼이 있었다. 나는 망설이지 않고 눌렀다.","하지만 알림은 사라지지 않았다. 대신 '반송하려면 발신지에서 직접 접수하십시오'라는 문구가 나타났다. 발신지는 6층 604호였다.","나는 다시 엘리베이터에 탔다. 이번에는 영상 기기를 상자 안에 넣고 반송 라벨을 붙였다. 새벽 2시 14분, 존재하지 않는 6층이 다시 열렸다.","복도 바닥에서는 전보다 훨씬 빠르게 검은 것이 [[生える]] 시작했다. 양쪽 문 뒤에서는 내 목소리가 동시에 들렸다. '돌아봐.' '여기야.' '[[逃げる]] 필요 없어.'","나는 아무 대답도 하지 않고 604호까지 걸었다. 감시 카메라가 [[動作]]하며 붉게 깜빡였고, 모니터 속 수십 명의 내가 일제히 고개를 돌려 나를 바라봤다.","전광판의 숫자가 13에서 줄어들기 시작했다. 매 [[秒]]마다 복도가 조금씩 좁아졌다. 나는 발목을 붙잡는 검은 덩어리를 떼어 내고, 마지막까지 뒤를 보지 않으려 이를 악물었다.","3[[秒]]. 나는 상자를 604호 우편 투입구에 밀어 넣었다. 2[[秒]]. 모니터 속 모든 얼굴이 동시에 비명을 질렀다. 1[[秒]]. 기계의 붉은 불이 꺼지며 [[動作]]이 멈췄다.","나는 엘리베이터까지 [[逃げる]] 듯 달렸다. 닫히는 문을 붙잡고 몸을 안으로 밀어 넣는 데 마지막 [[努力]]을 쏟았다. 문이 닫히자 6층 버튼은 흔적도 없이 사라졌다.","다음 날 [[朝刊]]에는 철거 작업이 시작된다는 짧은 기사만 실렸다. 건물 도면을 다시 확인해도 6층에 관한 [[情報]]는 어디에도 없었다.","휴대전화의 이상한 [[通知]]도 모두 사라져 있었다. 다만 주머니 안에는 작은 우편 영수증 한 장이 [[残る]] 있었다. '반송 완료. 발신인 없음. 수신인 없음.'","나는 그 종이를 찢어 버리고 건물을 나왔다. 길 건너 유리창에 비친 내 모습이 보였다. 나는 일부러 손을 들었다. 유리 속의 나도 정확히 같은 순간 손을 들었다.","그제야 숨을 내쉬었다. 뒤쪽에서 철거 장비가 움직이는 소리가 났고, 존재하지 않는 6층 높이에서 작은 불빛 하나가 켜졌다가 곧 꺼졌다. 이번에는 돌아보지 않았다."]},{"title":"4부 · 죽은 역의 조간신문","body":["철거가 끝난 지 석 달째 되던 아침, 구독한 적 없는 [[朝刊]] 한 부가 현관 앞에 놓여 있었다. 1면의 [[主要]] 기사 제목은 ‘폐쇄된 [[石油]] [[産業]] 단지에서 8년 전 실종자 발견’이었다.","사진 속 실종자는 나였다. 기사에는 그 사람이 [[過去]]에 이 지역에서 일했고, [[現在]]는 행방을 알 수 없다고 적혀 있었다. 기사 아래의 연락처를 검색했지만 제대로 된 [[情報]]는 하나도 나오지 않았다.","신문 뒷면의 [[裏]]에는 검은 펜으로 ‘[[月末]], 마지막 열차의 [[終点]]에서 기다리라’고 쓰여 있었다. 그 순간 휴대전화에 익숙한 [[通知]]가 떴다. ‘미배달 [[郵便]] 1건. 직접 수령 시 [[郵送]] 기록이 종료됩니다.’","나는 차를 몰아 폐역 근처까지 갔다. 역사는 오랫동안 [[留守]] 상태인 집처럼 텅 비어 있었다. 역 앞 [[広場]]에 차를 [[駐車]]한 뒤 큰길을 [[横断]]하자 두 번째 [[角]]부터 가로등이 모두 꺼져 있었다. 젖은 [[地面]] 위에는 검은 [[帯]]처럼 길게 이어진 자국이 역 뒤편 골목으로 향하고 있었다.","자국 끝에는 낡은 [[西洋]]식 건물 하나가 서 있었다. 1층은 오래전에 문을 닫은 [[薬局]]이었고, 안쪽에는 먼지 쌓인 [[家具]] 사이로 늙은 [[夫婦]]가 앉아 있었다. 나는 처음엔 두 사람이 전혀 모르는 [[他人]]이라 생각해 경계했다.","하지만 노인은 나를 보자 얼굴을 굳혔다. 그는 내 얼굴이 찍힌 오래된 사진을 내밀었다. 사진 뒤에는 [[父母]]라고 적혀 있었고, 가운데에는 운동복을 입은 소년이 서 있었다. 기록에는 소년의 [[身長]]과 ‘장래 희망: [[選手]]’라는 문장이 남아 있었다.","아내는 사진을 보며 끝내 울기 시작했다. 기록 여백에는 이상하게 [[泣く]]라는 단어가 여러 번 적혀 있었다. 그녀의 눈에서는 [[涙]]가 떨어졌고, ‘그때는 너무 [[悲しい]] 일이었지만, 지금은 그 아이가 너무 [[恋しい]]’라고 말했다.","약국 장부를 펼치자 같은 이름이 [[毎回]] 반복됐다. 증상은 [[腹痛]], 갑작스러운 [[血圧]] 상승, 그리고 며칠 뒤 [[退院]]. 날짜 옆에는 치료비 [[計算]]과 수치의 [[増減]]까지 세밀하게 적혀 있었다.","마지막 장에는 단 한 줄만 남아 있었다. ‘604호 환자, 생존 가능성 7[[割]]. 수령자와 얼굴이 같을 경우 즉시 지하로 이동.’ 나는 그 문장을 세 번 [[復習]]하듯 다시 읽었다. 그때 약국 지하에서 오래된 엘리베이터가 혼자 [[動作]]하기 시작했다."]},{"title":"5부 · 604호의 식탁","body":["지하 엘리베이터 문이 열리자 실제 병원이 아니라 사람이 살던 집처럼 꾸민 실험실이 나타났다. 낡은 [[家具]], 작은 침대, 식탁, 그리고 유리장 안에는 지나치게 [[高価]]해 보이는 [[小型]] 기계들이 놓여 있었다.","주방에는 녹슨 [[包丁・庖丁]]과 오래된 [[加熱]] 기구가 그대로 남아 있었다. 바닥 한쪽은 검은 얼룩이 [[汚す]] 흔적으로 번져 있었고, 그 틈에서 머리카락 같은 것이 천천히 [[生える]] 시작했다.","벽에는 실험 기록이 [[複数]] 붙어 있었다. 한 [[件]]마다 성공률이 적혀 있었고, 대부분 3[[割]]에서 8[[割]] 사이였다. ‘기억을 [[適当]]하게 섞으면 외형만 남는다’, ‘복제체가 [[完全]]해질수록 원본과 [[比べる]] 것이 [[難しい]]’ 같은 문장이 적혀 있었다.","실험의 [[基本]] 방식은 단순했다. 대상자의 물건을 천으로 [[包む]] 뒤 다른 방으로 [[移す]]. 연구원들은 같은 물건을 참가자들에게 하나씩 [[配る]]고, 누가 원래 주인인지 맞히게 했다. 문제는 그 물건을 받은 사람이 조금씩 원래 주인의 기억까지 갖게 된다는 것이었다.","나는 책상 위 영상 파일을 재생했다. 화면 속 소년은 손목에 검은 [[帯]]를 두르고 있었고, 카메라 기준 [[横]] 방향으로 놓인 침대에서 몸을 일으켰다. 방 끝에는 바닥이 보이지 않을 만큼 [[深い]] 구멍이 있었고, 입구는 한 사람이 겨우 지나갈 만큼 [[細い]] 통로로 이어졌다.","화면 오른쪽 위에는 붉은 [[丸]] 하나와 함께 13이라는 숫자가 떠 있었다. 매 [[秒]]마다 숫자가 줄어들자 소년의 [[動作]]가 조금씩 늦어졌다. 5[[秒]]가 남았을 때 화면 속 소년은 카메라를 보며 ‘[[逃げる]]’라고 말했다.","갑자기 실험실의 환풍기가 멈췄다. [[呼吸]]이 거칠어졌고 가슴이 조여 와 숨쉬기 [[苦しい]] 정도였다. 나는 문을 열려고 했지만 잠금장치가 풀리지 않아 [[困る]] 상황이 됐다.","그때 늙은 아내가 인터폰으로 소리쳤다. ‘문을 부수지 마요. [[感情的]]으로 움직이면 똑같이 돼요.’ 그녀는 내가 누르려던 비상 버튼을 [[断る]] 듯 강하게 제지했다.","책상 서랍에서 작은 메모를 찾았다. ‘가장 [[自然]]스러운 기억만 남겨라. 실험체가 자신을 원본이라고 [[疑う]]하기 시작하면, 다음 수령자에게 상자를 보낸다.’ 그 아래에는 내 이름과 503호 주소가 적혀 있었다.","마지막 영상을 재생하자 소년 옆에 서 있던 사람이 화면 앞으로 다가왔다. 얼굴은 지금의 나와 같았다. 그는 카메라를 보며 말했다. ‘[[最初]]의 나는 이미 없어. 네가 누구인지 알고 싶으면 0번 승강장으로 와.’"]},{"title":"6부 · 0번 승강장","body":["나는 약국 지하의 [[細い]] 통로를 따라 폐역 안쪽으로 들어갔다. 통로 끝에는 도면에 없는 0번 승강장이 있었고, 선로 너머에는 오래된 우편 분류기가 아직 [[動作]]하고 있었다.","기계 위에는 내 이름이 적힌 상자가 [[複数]] 놓여 있었다. 날짜를 [[比べる]] 보니 8년 전부터 오늘까지 [[月末]]마다 하나씩 이어져 있었다. 모든 상자의 발신인과 수신인은 같은 이름이었다.","가장 오래된 상자를 열자 사진, 병원 기록, 검은 [[帯]], 운동화, 작은 시계가 나왔다. 각각은 천으로 [[包む]] 상태였고, 라벨에는 ‘기억 보존 후 다음 실험실로 [[移す]]’라고 적혀 있었다.","플랫폼 전광판이 켜지며 새 [[通知]]가 떴다. ‘원본 회수까지 13[[秒]].’ 동시에 선로의 [[地面]]과 벽 틈에서 검은 것이 빠르게 [[生える]] 시작했다.","나는 지금까지의 기록을 머릿속으로 [[復習]]했다. [[石油]] 단지, [[薬局]], 병원, 604호, 그리고 존재하지 않는 6층. 겉으로는 서로 다른 [[件]]처럼 보였지만 모두 하나의 실험이었다.","기계 옆 설명서의 [[主要]] 항목에는 이렇게 적혀 있었다. ‘기억 전송 성공률 7[[割]]. 외형 안정 후에는 원본 여부를 [[計算]]으로 판별할 수 없음. 최종 단계에서는 대상자가 스스로 다음 물품을 [[郵送]]하도록 유도한다.’","10[[秒]]. 플랫폼 반대편에서 나와 같은 얼굴을 한 사람들이 나타났다. 어떤 이는 병원복을 입고 있었고, 어떤 이는 [[選手]]의 유니폼을 입고 있었다. 나는 그들이 단순한 [[他人]]인지, 혹은 내 [[過去]]인지 알 수 없었다.","8[[秒]]. 맨 앞의 남자가 말했다. ‘상자를 보내. 그러면 [[完全]]해질 수 있어.’ 나는 고개를 저었다. 그가 내게 내민 접수서를 [[断る]] 순간, 그의 얼굴이 일그러졌다.","6[[秒]]. 검은 것이 발목을 감쌌다. [[呼吸]]이 빨라지고 몸이 [[苦しい]] 정도로 조여 왔지만, 나는 남은 힘을 끌어모아 우편 분류기의 전원함까지 달렸다. 덮개는 녹슬어 열기 [[難しい]] 상태였다.","4[[秒]]. 주머니에 있던 작은 [[包丁・庖丁]] 모양의 다용도 칼로 나사를 비틀었다. 손에 검은 기름이 묻어 손바닥을 [[汚す]] 정도였지만 멈추지 않았다. 내부에는 오래된 [[加熱]] 장치와 [[小型]] 모터가 연결돼 있었다.","3[[秒]]. 나는 전선을 잡아당겼다. [[高価]]해 보이던 기억 저장 장치들이 하나씩 꺼졌다. 2[[秒]]. 화면에 내 [[血圧]], [[身長]], [[腹痛]] 기록과 [[退院]] 날짜가 빠르게 지나갔다.","1[[秒]]. 마지막 화면에는 사진 속 [[夫婦]]와 [[父母]]라는 단어가 겹쳐 나타났다. 그 아래에는 ‘관계: 조작됨’이라고 적혀 있었다. 나는 그 순간에야 약국의 두 사람이 내 부모가 아니라 실험의 관리인이었다는 걸 이해했다.","나는 온 힘을 쏟는 [[努力]] 끝에 메인 전선을 뽑았다. 모든 불이 꺼졌고, 플랫폼에 있던 얼굴들이 동시에 뒤로 물러났다. 누군가는 [[泣く]] 듯 얼굴을 찡그렸고, 누군가의 뺨에서는 [[涙]]가 떨어졌다.","어둠 속에서 ‘[[逃げる]]’라는 목소리가 들렸다. 나는 선로를 [[横断]]해 비상계단으로 뛰었다. 계단 끝 두 번째 [[角]]을 돌자 바깥 [[広場]]의 새벽빛이 보였다.","밖으로 나오니 구독하지 않은 [[朝刊]]이 벤치 위에 놓여 있었다. 1면에는 ‘폐역 화재, 관련 [[産業]] 시설 철거 결정’이라고 적혀 있었고, 내 실종 기사도, 604호도, 0번 승강장도 어디에도 없었다.","늙은 [[夫婦]]가 있던 [[西洋]]식 [[薬局]] 역시 사라져 있었다. 그 자리는 빈 [[駐車]] 공간뿐이었다. 나는 휴대전화에서 관련 [[情報]]를 다시 검색했지만 아무 기록도 찾지 못했다.","집으로 돌아오는 길, 나는 내가 정말 원본인지 다시 [[疑う]]했다. 하지만 더는 답을 찾지 않기로 했다. 기억이 진짜인지 아닌지보다, [[現在]] 내가 선택하는 일이 더 중요하다고 생각했다.","며칠 뒤 현관 앞에 작은 [[郵便]] 봉투 하나가 놓여 있었다. 나는 열지 않고 곧바로 반송함에 넣었다. 발신인은 비어 있었고, [[裏]]에는 단 한 문장만 적혀 있었다. ‘[[自然]]스럽게 살아. 다음 [[通知]]가 와도 절대 받지 마.’","반송함 문을 닫았는데도 얇은 영수증 한 장이 손안에 [[残る]] 있었다. 발신 시간은 내일 새벽 2시 14분이었다.","그날 밤 창문에 비친 내 모습이 아주 잠깐 늦게 웃었다. 차이는 1[[秒]]도 되지 않았다. 나는 한동안 창문을 바라봤지만, 이번에는 아무것도 확인하려 하지 않았다."]}]},"hard":{"title":"수신인: 나 · 0번 승강장 (하드)","episodes":[{"title":"1부 · 수신인 나 (하드모드)","body":["[[留守]]. 503호. [[現在]] 1:13. [[通知]]. [[郵便]]. [[郵送]] 2:14. 발신인=수신인=나.","[[情報]]. 동일 [[件]]. [[疑う]]. 장난 아님.","상자. 라벨 [[裏]]: '13[[秒]]. [[裏]] 금지.'","라벨 항목: [[郵便]]. [[郵送]]. [[件]]. [[複数]]. [[留守]].","[[小型]]. 비[[高価]]. 무전원 [[動作]].","화면: 복도. 내 얼굴. [[呼吸]]. [[苦しい]]. [[逃げる]].","'[[最初]]엔 [[疑う]]. 2:14—'","13[[秒]]. 암전.","[[通知]] 2: 61분 후 604호. [[過去]] 도면 [[複数]]. 6층 부재. 상승 [[動作]]."]},{"title":"2부 · 6층 13초","body":["2:14. 빈칸 6. [[細い]] 복도. [[深い]] 암흑. 13[[秒]]. 타일 틈 [[生える]].","'[[逃げる]].' 정면 고정. 카메라 [[動作]]. 붉은 [[丸]]. [[呼吸]]. [[苦しい]].","604호. 상자 [[複数]]. 날짜 [[比べる]]. 오늘·내일·[[月末]].","모니터. [[動作]] 1[[秒]] 지연. 화면이 먼저. [[疑う]] 무의미.","[[通知]] 3: 복제 92%. 회전=[[完全]]. 등 뒤 '돌아봐.' [[断る]].","문 폐쇄. 2[[秒]]. [[努力]]. 문틈. 어깨. 몸. [[逃げる]].","화면 속 웃음: '다음 [[郵便]] [[郵送]]. 발신인=너. [[断る]] 불가.'"]},{"title":"3부 · 반송·조간·약국","body":["503호. [[裏]] 절개. 반송 라벨. [[過去]] 8년. [[件]] [[複数]].","[[基本]] 2행: 회전=복제 [[完全]]. 복제체가 다음에게 [[配る]].","영상 속 남자=[[他人]]. 흉내. [[疑う]] 대상.","[[通知]] 4. 미수령 1[[件]]. '수령 [[断る]].' 압. [[残る]].","반송=발신지 604호. [[包む]]. [[郵送]]. 2:14. 재[[動作]].","[[生える]] 가속. [[横]] 문 뒤 목소리 [[複数]]: '돌아봐.'","3[[秒]]. 투입구. 2[[秒]]. 비명. 1[[秒]]. [[丸]] 소등. [[動作]] 정지.","[[逃げる]]. 6층 버튼 소멸. 영수증 [[残る]]: 발신인 [[留守]].","석 달 뒤 [[朝刊]]. 1면 [[主要]]: 폐쇄 [[石油]] [[産業]] 단지. 8년 전 실종자=나.","[[裏]] 검은 펜: '[[月末]]. 막차 [[終点]].'","폐역. [[広場]] [[駐車]]. [[横断]]. 두 번째 [[角]]. 가로등 전멸.","젖은 [[地面]]. [[帯]] 자국. 골목 끝.","[[西洋]]식. 1층 [[薬局]] 폐점. 먼지 [[家具]]. 노년 [[夫婦]].","사진 [[裏]]: [[父母]]. [[身長]]. 장래 희망 [[選手]].","아내 [[泣く]]. [[涙]]. '그때 [[悲しい]]. 지금 [[恋しい]].'","장부: [[毎回]] 동일 이름. [[腹痛]]. [[血圧]]. [[退院]]. [[計算]]. [[増減]].","마지막 행: '생존 7[[割]]. 얼굴 동일 시 지하 [[移す]]. [[毎回]].'","[[薬局]] 지하. 엘리베이터 단독 [[動作]]."]},{"title":"4부 · 0번 승강장","body":["지하=집. [[家具]]. 침대. 식탁. 유리장: [[高価]]. [[小型]].","주방: [[包丁・庖丁]]. [[加熱]]. 바닥 [[汚す]] 얼룩. 틈 [[生える]].","벽 기록 [[複数]]. [[件]]당 3[[割]]~8[[割]].","'[[適当]]히 섞으면 외형만 [[残る]].' '[[完全]]할수록 [[比べる]] 것이 [[難しい]].'","[[基本]] 절차: 물건 [[包む]]. 옆방 [[移す]]. 참가자에게 [[配る]]. 적중자가 기억 취득.","영상. 소년. 손목 [[帯]]. [[横]] 침대. 끝 [[深い]] 구멍. 입구 [[細い]].","붉은 [[丸]] 13. 매 [[秒]] [[動作]] 지연. 5[[秒]]: '[[逃げる]].'","환풍기 정지. [[呼吸]]. [[苦しい]]. 잠금 실패. [[困る]].","인터폰: '부수지 마. [[感情的]]=동일화.' 비상 버튼 [[断る]]. [[困る]].","메모: '[[自然]] 기억만 [[残る]]. [[疑う]] 시작=[[郵送]].' 이름=503호.","영상. 남자=내 얼굴: '[[最初]]의 나=[[他人]]. [[過去]]=[[郵送]]됨. 0번.'","[[細い]] [[深い]] 통로. 도면 외 0번. 분류기 [[動作]] 중.","상자 [[複数]]. 8년. [[月末]]마다 1[[件]]. 발신인=수신인.","최고참 상자: 사진. [[帯]]. 시계. 전부 [[包む]]. 라벨: '[[包む]] 후 [[移す]].'","[[通知]]: 원본 회수 13[[秒]]. 선로 [[地面]] 틈 [[生える]].","[[復習]]: [[石油]] 단지. [[薬局]]. 병원. 604호. 없는 6층. 하나.","설명서 [[主要]]: 성공률 7[[割]]. 원본 여부 [[計算]] 불가. 대상자 자력 [[郵送]] 유도.","10[[秒]]. 반대편 동일 얼굴. 병원복. [[選手]] 유니폼. [[他人]]인지 [[過去]]인지 불명.","8[[秒]]. '보내면 [[完全]].' 접수서. [[断る]].","6[[秒]]. 발목. [[呼吸]]. [[苦しい]]. 전원함. 개방 [[難しい]].","4[[秒]]. [[包丁・庖丁]] 형 칼. 나사. 기름 [[汚す]]. 내부 [[加熱]]. [[小型]] 모터.","3[[秒]]. [[高価]] 저장 장치 순차 소등.","2[[秒]]. 화면: [[血圧]]. [[身長]]. [[腹痛]]. [[退院]]. [[増減]]. [[計算]] 중단.","1[[秒]]. [[夫婦]]=[[父母]] 중첩. '관계: 조작.' 관리인.","[[努力]]. 메인 전선. 암전. 얼굴들 후퇴. [[泣く]] 형상. [[涙]].","'[[逃げる]].' 선로 [[横断]]. 두 번째 [[角]]. [[広場]] 새벽빛.","벤치 [[朝刊]] [[主要]]: '폐역 화재. [[産業]] 철거.' 604호·0번 [[情報]] 없음.","[[西洋]]식 [[薬局]] 자리=빈 [[駐車]] 칸. [[情報]] 0[[件]].","며칠 뒤 [[郵便]]. 미개봉 반송. [[裏]]: '[[自然]]스럽게. 다음 [[通知]] [[断る]].'","영수증 [[残る]]. [[郵送]] 내일 2:14.","창문 속 내가 1[[秒]] 지연 웃음. [[現在]]만. [[疑う]] 종료."]}]}}}]}};
const LEVEL_ORDER = ["n5","n4","n3"];

let currentLevelKey = null;
let currentStoryIndex = 0;
let currentEpisode = 0;
let mode = "kanji";
// "basic" | "hard" — a SEPARATE axis from the kanji/hangul/mnemonic display
// mode above: this picks which of that day's two stories (same 70 words,
// different density) is showing. Kept as its own variable rather than a
// 4th display-mode tab because it changes what episodes/title exist, not
// just how the same text renders.
let currentDifficulty = "basic";

const $ = (id) => document.getElementById(id);
const hubView = $("hubView");
const storyView = $("storyView");
const topbar = $("topbar");
const levelGrid = $("levelGrid");
const storySwitchEl = $("storySwitch");
const storyEl = $("story");
const kanjiTab = $("kanjiTab");
const hangulTab = $("hangulTab");
const mnemonicTab = $("mnemonicTab");
const mnemonicWrap = $("mnemonicWrap");
const mnemonicGrid = $("mnemonicGrid");
const tocPanel = $("tocPanel");
const sheet = $("sheet");
const scrim = $("scrim");

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

// Which of a level's stories is "today's" — the first one whose `days`
// list contains today's weekday (0=Sun..6=Sat). A story with days:null
// (the N3 single-story case) always matches, so it's always "today's".
function todaysStoryIndex(level) {
  const dow = new Date().getDay();
  const idx = level.stories.findIndex(s => !s.days || s.days.includes(dow));
  return idx >= 0 ? idx : 0;
}

// Level picker as a page list, not a card grid: icon tile + title +
// one-line subtitle + chevron, same primitive the TOC and the settings
// disclosure use.
function renderLevelGrid() {
  levelGrid.innerHTML = LEVEL_ORDER.map(key => {
    const l = LEVELS[key];
    const wordCount = Object.keys(l.lexicon).length;
    const sub = l.ready ? `${l.subtitle} · 단어 ${wordCount}개` : l.subtitle;
    return `<button class="row" type="button" data-level="${key}" ${l.ready ? "" : "disabled"}>
      <span class="row-icon">${l.label}</span>
      <span class="row-main">
        <span class="row-title">${escapeHtml(l.full)}${l.ready ? "" : '<span class="row-tag">준비중</span>'}</span>
        <span class="row-sub">${escapeHtml(sub)}</span>
      </span>
      <span class="row-chev">${l.ready ? "›" : ""}</span>
    </button>`;
  }).join("");
}

function openLevel(key) {
  const l = LEVELS[key];
  if (!l.ready) return;
  currentLevelKey = key;
  currentStoryIndex = todaysStoryIndex(l);
  currentEpisode = 0;
  mode = localStorage.getItem("readingMode_" + key) || "kanji";
  if (!["kanji","hangul","mnemonic"].includes(mode)) mode = "kanji";
  currentDifficulty = localStorage.getItem("difficulty_" + key) || "basic";
  if (!["basic","hard"].includes(currentDifficulty)) currentDifficulty = "basic";
  hubView.style.display = "none";
  topbar.style.display = "";
  storyView.style.display = "";
  // Chrome always starts collapsed, so a level opens onto the story.
  $("settingsPanel").classList.remove("open");
  $("settingsTrigger").classList.remove("open");
  $("settingsTrigger").setAttribute("aria-expanded", "false");
  setToc(false);
  $("brandLabel").textContent = l.full;
  $("guideText").textContent = "단어를 누르면 읽는 법·뜻·한자별 연상법을 볼 수 있어요.";
  render();
}

function backToHub() {
  currentLevelKey = null;
  closeWord();
  topbar.style.display = "none";
  storyView.style.display = "none";
  hubView.style.display = "";
}

function lv() { return LEVELS[currentLevelKey]; }
function activeStory() { return lv().stories[currentStoryIndex]; }
// Resolves the CONTENT (title + episodes) for today's story at the current
// difficulty — falls back to basic when a story has no hard variant (N3's
// single story, or any future level that hasn't gotten a hard pass yet),
// so nothing ever renders undefined just because "hard" was requested.
function activeMode() {
  const story = activeStory();
  return story.modes[currentDifficulty] || story.modes.basic;
}
// Today/review status for one word. Levels with dayBasedReview (N5) reuse
// the SAME 70-word set every day, so the split is per-day, not per-word:
// day index 0 (Mon) = first exposure, index N = the Nth review pass.
// Other levels (N3) keep the original per-word todayWords split.
function wordBadge(key) {
  const l = lv();
  if (l.dayBasedReview) {
    return currentStoryIndex === 0
      ? { isToday: true, text: "오늘" }
      : { isToday: false, text: `복습 ${currentStoryIndex}회차` };
  }
  const isToday = new Set(l.todayWords).has(key);
  return { isToday, text: isToday ? "오늘" : "복습" };
}
function setDifficulty(d) {
  currentDifficulty = d;
  currentEpisode = 0;
  localStorage.setItem("difficulty_" + currentLevelKey, d);
  closeWord();
  render();
}

// Read-only "which day's story this is" label — deliberately NOT a
// switcher. Letting someone browse ahead to Friday's story on a Tuesday
// would defeat the whole point of pacing 70 words across the week; the
// only thing shown here is which slot today's story belongs to. The
// basic/hard toggle alongside it IS interactive — that axis isn't paced,
// both are always the same day's words, just different density.
function renderStorySwitch() {
  const l = lv();
  const story = activeStory();
  const hasHard = !!story.modes.hard;
  const dayLabel = l.stories.length > 1
    ? `<span class="story-chip"><span class="dot"></span>${escapeHtml(story.label)} · 오늘의 이야기</span>`
    : "";
  const difficultyToggle = hasHard ? `
    <div class="difficulty-toggle" role="tablist" aria-label="난이도">
      <button class="diff-tab ${currentDifficulty === "basic" ? "active" : ""}" type="button" data-diff="basic">기본</button>
      <button class="diff-tab ${currentDifficulty === "hard" ? "active" : ""}" type="button" data-diff="hard">하드</button>
    </div>` : "";
  if (!dayLabel && !difficultyToggle) { storySwitchEl.innerHTML = ""; return; }
  storySwitchEl.innerHTML = dayLabel + difficultyToggle;
}

function renderParagraph(text) {
  const { lexicon } = lv();
  const parts = text.split(/(\[\[.*?\]\])/g);
  return parts.map(part => {
    const m = part.match(/^\[\[(.*?)\]\]$/);
    if (!m) return escapeHtml(part);
    const key = m[1];
    const item = lexicon[key];
    const display = mode === "hangul" ? item.hangul : key;
    return `<button class="word" type="button" data-word="${escapeHtml(key)}">${escapeHtml(display)}</button>`;
  }).join("");
}

function getEpisodeWords(ep) {
  const found = [];
  for (const p of ep.body) {
    const matches = [...p.matchAll(/\[\[(.*?)\]\]/g)].map(m => m[1]);
    found.push(...matches);
  }
  return [...new Set(found)];
}

function renderToc() {
  const { episodes } = activeMode();
  tocPanel.innerHTML = episodes.map((ep, i) => `
    <button class="toc-item ${i === currentEpisode ? "active" : ""}" type="button" data-ep="${i}">
      <span class="toc-num">EP ${String(i + 1).padStart(2,"0")}</span>
      <span class="toc-name">${escapeHtml(ep.title)}</span>
    </button>`).join("");
}

function getKanjiChars(key) {
  return [...key].filter(ch => /[\u3400-\u9fff]/.test(ch));
}

function renderKanjiBreakdown(key) {
  const { kanjiHints } = lv();
  const chars = getKanjiChars(key);
  if (!chars.length) return "";
  return `<div class="kanji-breakdown">
    <div class="kanji-breakdown-title">한자 하나씩 연상</div>
    ${chars.map(ch => {
      const h = kanjiHints[ch] || {parts:"글자 전체 모양", memory:`${ch}의 모양과 단어 뜻을 하나의 장면으로 연결해 기억해 보세요.`};
      return `<div class="kanji-row">
        <div class="kanji-char">${escapeHtml(ch)}</div>
        <div class="kanji-detail"><strong>${escapeHtml(h.parts)}</strong><br>${escapeHtml(h.memory)}</div>
      </div>`;
    }).join("")}
  </div>`;
}

function renderMnemonics(ep) {
  const { lexicon, mnemonics } = lv();
  const words = getEpisodeWords(ep);
  mnemonicGrid.innerHTML = words.map(key => {
    const item = lexicon[key];
    const m = mnemonics[key] || {parts:"글자 전체 모양", memory:`${key}의 뜻인 '${item.meaning}' 장면과 글자 모양을 연결해 기억해 보세요.`};
    const badge = wordBadge(key);
    return `<article class="mnemonic-card">
      <div class="mnemonic-head">
        <div>
          <div class="mnemonic-word">${escapeHtml(key)}<span class="word-badge ${badge.isToday ? "today" : ""}">${badge.text}</span></div>
          <div class="mnemonic-reading">${escapeHtml(item.kana)} · ${escapeHtml(item.hangul)}</div>
        </div>
        <div class="mnemonic-meaning">${escapeHtml(item.meaning)}</div>
      </div>
      ${renderKanjiBreakdown(key)}
      <div class="word-mnemonic-title">단어 전체 연상</div>
      <div class="word-mnemonic-text">${escapeHtml(m.memory)}</div>
    </article>`;
  }).join("");
}

function render() {
  const { lexicon, todayWords, dayBasedReview } = lv();
  const m = activeMode();
  const ep = m.episodes[currentEpisode];
  renderStorySwitch();
  $("epCount").textContent = `${m.title} · EPISODE ${String(currentEpisode + 1).padStart(2,"0")} / ${String(m.episodes.length).padStart(2,"0")}`;
  $("epMiniTitle").textContent = ep.title;
  $("title").textContent = mode === "mnemonic" ? `${ep.title} · 연상법` : ep.title;
  storyEl.innerHTML = ep.body.map(p => `<p>${renderParagraph(p)}</p>`).join("");
  const epWords = getEpisodeWords(ep);
  // Footer carries two non-overlapping numbers: this episode's word load,
  // and the level's total vocabulary. The old third line repeated the
  // episode count verbatim, so it's gone.
  const wordSummary = dayBasedReview
    ? (currentStoryIndex === 0
        ? `이번 화 단어 ${epWords.length}개 · 오늘 ${epWords.length}개`
        : `이번 화 단어 ${epWords.length}개 · 복습 ${currentStoryIndex}회차`)
    : (() => {
        const todaySet = new Set(todayWords);
        const todayCount = epWords.filter(w => todaySet.has(w)).length;
        return `이번 화 단어 ${epWords.length}개 · 오늘 ${todayCount} · 복습 ${epWords.length - todayCount}`;
      })();
  $("episodeWordCount").textContent = wordSummary;
  $("totalLabel").textContent = `${lv().label} 보유 ${Object.keys(lexicon).length}단어`;
  const first = currentEpisode === 0, last = currentEpisode === m.episodes.length - 1;
  $("prevTop").disabled = first; $("prevBottom").disabled = first; $("nextTop").disabled = last; $("nextBottom").disabled = last;
  kanjiTab.classList.toggle("active", mode === "kanji");
  hangulTab.classList.toggle("active", mode === "hangul");
  mnemonicTab.classList.toggle("active", mode === "mnemonic");
  const isMnemonic = mode === "mnemonic";
  storyEl.classList.toggle("hidden", isMnemonic);
  mnemonicWrap.classList.toggle("active", isMnemonic);
  if (isMnemonic) renderMnemonics(ep);
  renderToc();
  window.scrollTo({top:0, behavior:"instant"});
}

function setMode(nextMode) {
  mode = nextMode;
  localStorage.setItem("readingMode_" + currentLevelKey, mode);
  render();
}

function go(delta) {
  const { episodes } = activeMode();
  const next = currentEpisode + delta;
  if (next < 0 || next >= episodes.length) return;
  currentEpisode = next;
  closeWord();
  render();
}

function openWord(key) {
  const { lexicon, mnemonics } = lv();
  const item = lexicon[key];
  $("sheetKanji").textContent = key;
  $("sheetReading").innerHTML =
    `<span class="label">읽는 법</span>${escapeHtml(item.kana)} · ${escapeHtml(item.hangul)}`;
  $("sheetMeaning").innerHTML =
    `<span class="label">뜻</span>${escapeHtml(item.meaning)}`;
  const m = mnemonics[key] || {parts:"글자 전체 모양", memory:`${key}의 뜻과 글자 모양을 연결해 기억해 보세요.`};
  const badge = wordBadge(key);
  const badgeLabel = badge.isToday ? "오늘 단어" : `${badge.text} 단어`;
  $("sheetMnemonic").innerHTML = `<span class="label">연상법 · ${badgeLabel}</span>${renderKanjiBreakdown(key)}<div class="word-mnemonic-title">단어 전체 연상</div><div class="word-mnemonic-text">${escapeHtml(m.memory)}</div>`;
  sheet.classList.add("open");
  scrim.classList.add("open");
  sheet.setAttribute("aria-hidden","false");
}

function closeWord() {
  sheet.classList.remove("open");
  scrim.classList.remove("open");
  sheet.setAttribute("aria-hidden","true");
}

levelGrid.addEventListener("click", e => {
  const btn = e.target.closest(".row");
  if (btn && !btn.disabled) openLevel(btn.dataset.level);
});
$("backToHub").addEventListener("click", backToHub);
storyEl.addEventListener("click", e => {
  const target = e.target.closest(".word");
  if (target) openWord(target.dataset.word);
});
kanjiTab.addEventListener("click", () => setMode("kanji"));
hangulTab.addEventListener("click", () => setMode("hangul"));
mnemonicTab.addEventListener("click", () => setMode("mnemonic"));
storySwitchEl.addEventListener("click", e => {
  const btn = e.target.closest(".diff-tab");
  if (btn) setDifficulty(btn.dataset.diff);
});
// The TOC is a nested disclosure inside the settings row — same
// expand-chevron affordance one level down, like a Notion page with
// children. State lives on the row's class so the chevron rotation and
// aria-expanded never drift apart.
function setToc(open) {
  tocPanel.classList.toggle("open", open);
  $("tocTrigger").classList.toggle("open", open);
  $("tocTrigger").setAttribute("aria-expanded", String(open));
}
$("tocTrigger").addEventListener("click", () => setToc(!tocPanel.classList.contains("open")));
tocPanel.addEventListener("click", e => {
  const item = e.target.closest(".toc-item"); if (!item) return;
  currentEpisode = Number(item.dataset.ep);
  setToc(false);
  closeWord(); render();
});
$("prevTop").addEventListener("click", () => go(-1));
$("prevBottom").addEventListener("click", () => go(-1));
$("nextTop").addEventListener("click", () => go(1));
$("nextBottom").addEventListener("click", () => go(1));
$("closeSheet").addEventListener("click", closeWord);
scrim.addEventListener("click", closeWord);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeWord(); return; }
  if (!currentLevelKey) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});

// ---- theme (dark/light), manual override on top of prefers-color-scheme ----
// Stored value wins in both directions once set; before that, the CSS's own
// @media query decides, so a first-time visitor gets the right theme with
// no flash-of-wrong-theme and no JS needed at all.
const THEME_KEY = "wordThrillerTheme";
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  const icon = t === "dark" ? "☀️" : t === "light" ? "🌙" : "🌓";
  const btn1 = $("themeToggle"), btn2 = $("themeToggleHub");
  if (btn1) btn1.textContent = icon;
  if (btn2) btn2.textContent = icon;
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme")
    || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
applyTheme(localStorage.getItem(THEME_KEY));
$("themeToggle").addEventListener("click", toggleTheme);
$("themeToggleHub").addEventListener("click", toggleTheme);

// ---- collapsed-by-default settings row (display mode + TOC) ----
$("settingsTrigger").addEventListener("click", () => {
  const open = $("settingsPanel").classList.toggle("open");
  $("settingsTrigger").classList.toggle("open", open);
  $("settingsTrigger").setAttribute("aria-expanded", String(open));
  if (!open) setToc(false);
});

renderLevelGrid();
</script>
</body>
</html>
